<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>図版ジェネレーター</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; padding: 0; font-size: 12px; }
    
    .sticky-header {
      position: sticky; top: 0; background-color: #0f172a; z-index: 100;
      padding: 10px 10px 12px 10px; border-bottom: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    
    .header { font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #38bdf8; }
    .section { margin-bottom: 10px; padding: 0 10px; }
    
    .label { font-weight: bold; color: #94a3b8; margin-bottom: 4px; display: block; font-size: 11px; }
    .current-type-name { color: #38bdf8; font-weight: bold; font-size: 12px; margin-bottom: 8px; display: block; line-height: 1.4; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .btn-theme { background: #1e293b; border: 1px solid #475569; color: #94a3b8; padding: 6px; border-radius: 4px; text-align: left; cursor: pointer; font-size: 10px; }
    .btn-theme.active { border-color: #38bdf8; background: #0284c7; color: #fff; font-weight: bold; }
    select, input[type="text"] { width: 100%; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 6px; border-radius: 4px; font-size: 11px; margin-bottom: 4px; outline:none; }
    
    .card { background: #1e293b; border: 1px solid #334155; padding: 8px; border-radius: 4px; margin-bottom: 6px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: #94a3b8; font-size: 10px; }
    
    .color-ui { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; background: #0f172a; padding: 6px; border-radius: 4px; border: 1px solid #475569; }
    .hue-btns { display: flex; gap: 4px; }
    .btn-hue { flex: 1; border: 1px solid #475569; background: #1e293b; color: #cbd5e1; padding: 4px 0; border-radius: 3px; cursor: pointer; font-size: 9px; text-align: center; }
    .btn-hue.active { border-color: #38bdf8; font-weight: bold; color: #fff; background: #0284c7; }
    .slider-row { display: flex; align-items: center; gap: 8px; }
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #38bdf8; cursor: pointer; margin-top: -4px; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #475569; border-radius: 2px; }

    .preview-box { 
      background: #fafafa; border-radius: 4px; margin-bottom: 8px; 
      min-height: 120px; display: flex; align-items: center; justify-content: center; overflow:hidden;
      cursor: pointer; border: 2px solid transparent; transition: border 0.2s; position: relative;
    }
    .preview-box:hover { border: 2px solid #38bdf8; }
    .preview-box svg { width: 100%; height: 100%; max-height: 140px; margin-bottom: 15px; }
    
    .preview-box.is-initial { background: #ffffff; border: 2px dashed #cbd5e1; }
    .preview-box.is-initial:hover { border: 2px dashed #38bdf8; }
    .preview-box.is-initial svg { margin-bottom: 0; }
    
    .preview-box.has-diagram::after {
      content: "クリックして図解を変更"; position: absolute; bottom: 4px; left: 0; width: 100%;
      text-align: center; font-size: 10px; color: #64748b; font-weight: bold; pointer-events: none;
    }
    
    .btn-primary { width: 100%; background: #0284c7; border: none; color: #fff; font-weight: bold; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-primary:disabled { background: #475569; cursor: not-allowed; }
    .btn-add { background: #0284c7; color: #fff; border: none; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; }
    .btn-del { background: #ef4444; color: #fff; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 10px; }
    .detail-box { background: #1e293b; padding: 6px; border-radius: 4px; border: 1px solid #334155; margin-bottom: 6px; }
    .notice { font-size: 9px; color: #94a3b8; margin-top: 2px; }
    #logArea { margin-top: 6px; padding: 6px; border-radius: 4px; font-size: 10px; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; max-height: 70px; overflow-y: auto; word-break: break-all; }

    #frameworkModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.98); z-index: 200; overflow-y: auto; padding: 15px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-header h3 { color: #fff; font-size: 14px; margin: 0; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
    .category-label { color: #38bdf8; font-weight: bold; font-size: 12px; margin: 15px 0 10px 0; border-bottom: 1px dashed #334155; padding-bottom: 4px; }
    
    .thumb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .thumb-item {
      background: #1e293b; border: 1px solid #475569; border-radius: 6px; 
      overflow: hidden; cursor: pointer; transition: all 0.2s; 
      display: flex; flex-direction: column;
    }
    .thumb-item:hover { border-color: #38bdf8; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    .thumb-icon-wrap { background: #0f172a; height: 60px; display: flex; justify-content: center; align-items: center; padding: 10px; }
    .thumb-icon-wrap svg { width: 100%; height: 100%; }
    .thumb-title-wrap { padding: 8px; text-align: center; border-top: 1px solid #334155; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
    .thumb-title { color: #e2e8f0; font-size: 10px; font-weight: bold; line-height: 1.3; }
  </style>
</head>
<body>

  <div class="sticky-header">
    <div class="header">図版ジェネレーター</div>
    <span class="label">プレビュー</span>
    <span id="currentTypeName" class="current-type-name">図版を選択してください</span>
    <div class="preview-box is-initial" id="previewBox" onclick="openModal()"></div>
    <button id="btnInsert" onclick="insertToSlide()" class="btn-primary">スライドに挿入</button>
  </div>

  <div class="section">
    <span class="label">1. セグメント・カラー</span>
    <div class="grid">
      <button id="btn-corporate" onclick="selectTheme('corporate')" class="btn-theme active">全社基本 (#da3f24)</button>
      <button id="btn-pmo" onclick="selectTheme('pmo')" class="btn-theme">戦略PMO (#313C58)</button>
      <button id="btn-fandom" onclick="selectTheme('fandom')" class="btn-theme">ファンダム (#C3446E)</button>
      <button id="btn-sns" onclick="selectTheme('sns')" class="btn-theme">SNS統合 (#265A7A)</button>
    </div>
  </div>

  <div class="section" id="detailSettings" style="display:none;"></div>

  <div class="section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span class="label" style="margin:0;">2. テキスト＆カラー設定</span>
      <button onclick="addItem()" class="btn-add">＋追加</button>
    </div>
    <div id="itemsContainer"></div>
  </div>

  <div class="section" style="margin-top:8px;">
    <div class="notice">※ 挿入した図形やテキストはスライド上で自由に編集可能です。</div>
    <div id="logArea">初期化中...</div>
  </div>

  <div id="frameworkModal">
    <div class="modal-header">
      <h3>フレームワークを選択</h3>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div id="modalContent"></div>
  </div>

  <script>
    function log(msg, isError) {
      var el = document.getElementById('logArea');
      el.innerHTML = '<span style="color:' + (isError ? '#fca5a5' : '#86efac') + ';">[' + (isError ? 'エラー' : '情報') + '] ' + msg + '</span>';
    }

    var frameworkTypes = [
      { id: 'funnel_marketing', cat: 'プロセス・段階', name: 'マーケティングファネル (完成系)', icon: '<polygon points="10,0 90,0 70,40 30,40" fill="#38bdf8" opacity="0.8"/>' },
      { id: 'funnel', cat: 'プロセス・段階', name: 'パーチェスファネル (2〜6段)', icon: '<polygon points="30,0 70,0 90,40 10,40" fill="#38bdf8" opacity="0.8"/><line x1="20" y1="20" x2="80" y2="20" stroke="#0f172a" stroke-width="2"/>' },
      { id: 'chevron', cat: 'プロセス・段階', name: 'シェブロン（横ステップ）', icon: '<polygon points="0,5 30,5 40,20 30,35 0,35 10,20" fill="#38bdf8"/><polygon points="45,5 75,5 85,20 75,35 45,35 55,20" fill="#38bdf8" opacity="0.6"/>' },
      { id: 'process_arrow', cat: 'プロセス・段階', name: '矢印付きプロセス', icon: '<rect x="0" y="10" width="30" height="20" rx="4" fill="#38bdf8"/><polygon points="35,15 45,20 35,25" fill="#94a3b8"/><rect x="50" y="10" width="30" height="20" rx="4" fill="#38bdf8" opacity="0.6"/>' },
      { id: 'standalone_arrow', cat: 'プロセス・段階', name: '単体カスタム矢印', icon: '<polygon points="10,10 70,10 70,0 100,20 70,40 70,30 10,30" fill="#38bdf8"/>' },
      { id: 'pyramid', cat: 'プロセス・段階', name: 'ピラミッド（三角形重ね）', icon: '<polygon points="50,0 90,40 10,40" fill="#38bdf8" opacity="0.8"/><line x1="30" y1="20" x2="70" y2="20" stroke="#0f172a" stroke-width="2"/>' },
      
      { id: 'list_overlap', cat: 'リスト・手順', name: '円はみ出しリスト', icon: '<rect x="20" y="5" width="70" height="10" rx="2" fill="#38bdf8"/><circle cx="15" cy="10" r="8" fill="#fff" stroke="#38bdf8" stroke-width="2"/><rect x="20" y="25" width="70" height="10" rx="2" fill="#38bdf8" opacity="0.6"/><circle cx="15" cy="30" r="8" fill="#fff" stroke="#38bdf8" stroke-width="2"/>' },
      { id: 'list_number', cat: 'リスト・手順', name: 'シンプル番号バー', icon: '<text x="0" y="15" font-size="14" font-weight="bold" fill="#38bdf8">1</text><rect x="15" y="5" width="75" height="10" rx="2" fill="#38bdf8" opacity="0.3"/><text x="0" y="35" font-size="14" font-weight="bold" fill="#38bdf8" opacity="0.6">2</text><rect x="15" y="25" width="75" height="10" rx="2" fill="#38bdf8" opacity="0.2"/>' },
      { id: 'step_card', cat: 'リスト・手順', name: 'ステップカード', icon: '<rect x="10" y="10" width="30" height="30" rx="2" fill="#38bdf8" opacity="0.2"/><circle cx="25" cy="10" r="6" fill="#38bdf8"/><rect x="50" y="10" width="30" height="30" rx="2" fill="#38bdf8" opacity="0.2"/><circle cx="65" cy="10" r="6" fill="#38bdf8"/>' },

      { id: 'matrix', cat: '分析・分類', name: '2x2 マトリクス', icon: '<rect x="10" y="0" width="35" height="18" rx="2" fill="#38bdf8"/><rect x="50" y="0" width="35" height="18" rx="2" fill="#38bdf8" opacity="0.8"/><rect x="10" y="22" width="35" height="18" rx="2" fill="#38bdf8" opacity="0.6"/><rect x="50" y="22" width="35" height="18" rx="2" fill="#38bdf8" opacity="0.4"/>' },
      { id: 'venn', cat: '分析・分類', name: '3C / 2C ベン図', icon: '<circle cx="35" cy="15" r="15" fill="#38bdf8" opacity="0.7"/><circle cx="65" cy="15" r="15" fill="#38bdf8" opacity="0.7"/><circle cx="50" cy="30" r="15" fill="#38bdf8" opacity="0.7"/>' },
      { id: 'comparison', cat: '分析・分類', name: 'カラム比較', icon: '<rect x="10" y="0" width="35" height="8" fill="#38bdf8"/><rect x="10" y="8" width="35" height="32" fill="none" stroke="#38bdf8" stroke-width="2"/><rect x="55" y="0" width="35" height="8" fill="#38bdf8" opacity="0.6"/><rect x="55" y="8" width="35" height="32" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>' },
      
      { id: 'cycle', cat: '関係性・流れ', name: '循環 / ループ', icon: '<circle cx="50" cy="20" r="18" fill="none" stroke="#94a3b8" stroke-width="2"/><circle cx="50" cy="2" r="6" fill="#38bdf8"/><circle cx="68" cy="20" r="6" fill="#38bdf8" opacity="0.8"/><circle cx="50" cy="38" r="6" fill="#38bdf8" opacity="0.6"/><circle cx="32" cy="20" r="6" fill="#38bdf8" opacity="0.4"/>' },
      { id: 'onion', cat: '関係性・流れ', name: '同心円（オニオン）', icon: '<circle cx="30" cy="20" r="18" fill="#38bdf8" opacity="0.4"/><circle cx="30" cy="20" r="12" fill="#38bdf8" opacity="0.7"/><circle cx="30" cy="20" r="6" fill="#38bdf8"/><line x1="55" y1="8" x2="80" y2="8" stroke="#38bdf8" stroke-width="2"/><line x1="55" y1="20" x2="80" y2="20" stroke="#38bdf8" stroke-width="2"/><line x1="55" y1="32" x2="80" y2="32" stroke="#38bdf8" stroke-width="2"/>' },
      { id: 'timeline', cat: '関係性・流れ', name: 'タイムライン', icon: '<line x1="0" y1="20" x2="100" y2="20" stroke="#94a3b8" stroke-width="2"/><circle cx="20" cy="20" r="4" fill="#38bdf8"/><rect x="10" y="5" width="20" height="10" rx="2" fill="#38bdf8"/><circle cx="50" cy="20" r="4" fill="#38bdf8" opacity="0.7"/><rect x="40" y="25" width="20" height="10" rx="2" fill="#38bdf8" opacity="0.7"/><circle cx="80" cy="20" r="4" fill="#38bdf8" opacity="0.4"/><rect x="70" y="5" width="20" height="10" rx="2" fill="#38bdf8" opacity="0.4"/>' }
    ];

    var state = {
      theme: 'corporate', type: 'initial', arrowType: 'block', arrowWeight: 3,
      items: [
        { title: '認知', desc: 'マスメディア・SNS', hue: 'gray', shade: 4 },
        { title: '興味・関心', desc: 'オウンドメディア訪問', hue: 'gray', shade: 4 },
        { title: '比較・検討', desc: '資料請求・セミナー', hue: 'main', shade: 1 },
        { title: '購買', desc: '新規契約・購買層', hue: 'accent', shade: 0 }
      ]
    };

    var palettes = {
      corporate: { main: '#da3f24', accent: '#ff5d40' },
      pmo: { main: '#313C58', accent: '#da3f24' },
      fandom: { main: '#C3446E', accent: '#e4007f' },
      sns: { main: '#265A7A', accent: '#da3f24' }
    };

    function blendWithWhite(hex, percent) {
      var r = parseInt(hex.substring(1,3), 16), g = parseInt(hex.substring(3,5), 16), b = parseInt(hex.substring(5,7), 16);
      r = Math.round(r + (255 - r) * percent);
      g = Math.round(g + (255 - g) * percent);
      b = Math.round(b + (255 - b) * percent);
      return '#' + [r,g,b].map(function(x){ return x.toString(16).padStart(2,'0') }).join('');
    }

    function getItemHex(item) {
      var p = palettes[state.theme], baseHex = '#6F6F6F';
      if (item.hue === 'main') baseHex = p.main;
      if (item.hue === 'accent') baseHex = p.accent;
      var steps = [0, 0.2, 0.45, 0.7, 0.92]; 
      return blendWithWhite(baseHex, steps[item.shade]);
    }

    function getTextColor(hex) {
      var r = parseInt(hex.substring(1,3), 16), g = parseInt(hex.substring(3,5), 16), b = parseInt(hex.substring(5,7), 16);
      return ((r * 299 + g * 587 + b * 114) / 1000 >= 160) ? '#070322' : '#ffffff';
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function initModal() {
      var content = '';
      var currentCat = '';
      frameworkTypes.forEach(function(fw) {
        if (fw.cat !== currentCat) {
          if (currentCat !== '') { content += '</div>'; } 
          content += '<div class="category-label">' + fw.cat + '</div><div class="thumb-grid">';
          currentCat = fw.cat;
        }
        content += '<div class="thumb-item" onclick="changeType(\'' + fw.id + '\')">' +
                   '<div class="thumb-icon-wrap"><svg viewBox="0 0 100 40" preserveAspectRatio="xMidYMid meet">' + fw.icon + '</svg></div>' +
                   '<div class="thumb-title-wrap"><span class="thumb-title">' + fw.name + '</span></div></div>';
      });
      if (currentCat !== '') { content += '</div>'; }
      document.getElementById('modalContent').innerHTML = content;
    }
    
    function openModal() { document.getElementById('frameworkModal').style.display = 'block'; }
    function closeModal() { document.getElementById('frameworkModal').style.display = 'none'; }

    function selectTheme(name) {
      state.theme = name;
      ['corporate', 'pmo', 'fandom', 'sns'].forEach(function(t) {
        var btn = document.getElementById('btn-' + t);
        if (btn) btn.classList.toggle('active', t === name);
      });
      updateAll();
    }

    function changeType(val) {
      state.type = val;
      closeModal();
      
      if (val !== 'initial') {
        if (val === 'matrix') { while (state.items.length < 4) state.items.push({ title: '項目', desc: '説明', hue: 'gray', shade: 4 }); state.items = state.items.slice(0, 4); }
        if (val === 'venn' && state.items.length > 3) state.items = state.items.slice(0, 3);
        if (val === 'step_card' && state.items.length > 5) state.items = state.items.slice(0, 5);
      }
      
      var fw = frameworkTypes.find(f => f.id === val);
      document.getElementById('currentTypeName').innerText = fw ? fw.name : '図版を選択してください';

      renderDetailSettings();
      updateAll();
    }

    function updateArrowType(val) { state.arrowType = val; updatePreview(); }
    function updateArrowWeight(val) { state.arrowWeight = parseInt(val, 10); updatePreview(); }

    function renderDetailSettings() {
      var sec = document.getElementById('detailSettings');
      var html = '';
      if (state.type === 'standalone_arrow') {
        html += '<div class="detail-box"><span class="label">▶ 矢印の種類</span>' +
                '<select onchange="updateArrowType(this.value)"><option value="block">ブロック矢印</option><option value="line">直線矢印（線）</option><option value="curved_up">曲線矢印（右上り）</option></select>' +
                '<span class="label" style="margin-top:6px;">▶ 矢印の太さ</span>' +
                '<div class="slider-row"><span style="font-size:10px;color:#cbd5e1;">細</span><input type="range" min="1" max="5" value="' + state.arrowWeight + '" oninput="updateArrowWeight(this.value)"><span style="font-size:10px;color:#cbd5e1;">太</span></div></div>';
        state.arrowType = 'block';
      }
      sec.innerHTML = html;
      sec.style.display = html ? 'block' : 'none';
    }

    function addItem() {
      if (state.type === 'initial' || state.type === 'matrix') return;
      if (state.type === 'venn' && state.items.length >= 3) { log('ベン図は最大3つまでです', true); return; }
      if (state.type === 'funnel' && state.items.length >= 6) { log('ファネルは最大6段までです', true); return; }
      if (state.type === 'step_card' && state.items.length >= 5) { log('ステップカードは最大5つまでです', true); return; }
      state.items.push({ title: '新規項目', desc: '説明テキスト', hue: 'gray', shade: 4 }); 
      updateAll(); 
    }

    function removeItem(idx) {
      if (state.type === 'initial' || state.type === 'matrix') return;
      var minCount = (state.type === 'funnel') ? 2 : 1;
      if (state.items.length <= minCount) { log('最低' + minCount + 'つ必要です', true); return; }
      state.items.splice(idx, 1); updateAll();
    }

    function updateTitle(idx, val) { state.items[idx].title = val; updatePreview(); }
    function updateDesc(idx, val) { state.items[idx].desc = val; updatePreview(); }
    function setHue(idx, hueVal) { state.items[idx].hue = hueVal; renderInputs(); updatePreview(); }
    function setShade(idx, shadeVal) { state.items[idx].shade = parseInt(shadeVal, 10); updatePreview(); }

    function renderInputs() {
      var container = document.getElementById('itemsContainer');
      var btnAdd = document.querySelector('.btn-add');
      var t = state.type;

      if (t === 'initial') {
        container.innerHTML = '<div class="card" style="text-align:center; padding:20px; color:#94a3b8; font-size:13px; line-height:1.6;">上の「図版を選択」ボタンから、<br>作成したい構造図を選んでください。</div>';
        if (btnAdd) btnAdd.style.display = 'none';
        return;
      }

      var isMarketing = (t === 'funnel_marketing');
      var isMatrix = (t === 'matrix');
      var isVenn = (t === 'venn');
      var noText = (t === 'standalone_arrow');
      var noDesc = (isVenn || t === 'cycle' || t === 'list_number' || noText || isMarketing);

      if (isMarketing) {
        container.innerHTML = '<div class="card" style="text-align:center; padding:20px; color:#94a3b8; font-size:13px; line-height:1.6;"><span style="color:#cbd5e1; font-weight:bold;">【事前の設定は不要です】</span><br><br>そのまま「スライドに挿入」を押し、<br>挿入後にスライド上で直接編集してください。</div>';
        if (btnAdd) btnAdd.style.display = 'none';
        return;
      }

      var hideAdd = false;
      if (isMatrix) hideAdd = true;
      if (isVenn && state.items.length >= 3) hideAdd = true;
      if (t === 'funnel' && state.items.length >= 6) hideAdd = true;
      if (t === 'step_card' && state.items.length >= 5) hideAdd = true;
      if (btnAdd) btnAdd.style.display = hideAdd ? 'none' : 'block';

      var html = '';
      state.items.forEach(function(item, index) {
        var hue = item.hue;
        var disableDel = isMatrix ? ' style="display:none;"' : '';
        var titleInput = noText ? '' : '<input type="text" value="' + escapeHtml(item.title) + '" oninput="updateTitle(' + index + ', this.value)" placeholder="タイトル">';
        var descInput = noDesc ? '' : '<input type="text" value="' + escapeHtml(item.desc) + '" oninput="updateDesc(' + index + ', this.value)" placeholder="説明文">';
        var textAreas = noText ? '<div style="padding:6px; color:#94a3b8; font-size:11px;">※ この図形はテキストなしで挿入されます</div>' : (titleInput + descInput);

        html += '<div class="card"><div class="card-head"><span>#' + (index + 1) + '</span><button class="btn-del" onclick="removeItem(' + index + ')"' + disableDel + '>削除</button></div>' +
          '<div class="color-ui"><div class="hue-btns">' +
          '<button class="btn-hue ' + (hue==='main'?'active':'') + '" onclick="setHue(' + index + ',\'main\')">メイン</button>' +
          '<button class="btn-hue ' + (hue==='accent'?'active':'') + '" onclick="setHue(' + index + ',\'accent\')">アクセント</button>' +
          '<button class="btn-hue ' + (hue==='gray'?'active':'') + '" onclick="setHue(' + index + ',\'gray\')">無彩色</button></div>' +
          '<div class="slider-row"><span style="font-size:10px;color:#cbd5e1;">濃</span><input type="range" min="0" max="4" value="' + item.shade + '" oninput="setShade(' + index + ', this.value)"><span style="font-size:10px;color:#cbd5e1;">淡</span></div></div>' + textAreas + '</div>';
      });
      container.innerHTML = html;
    }

    function generateSVG() {
      var count = state.items.length, w = 1000, h = 500, inner = '';

      if (state.type === 'initial') {
        inner += '<rect width="1000" height="500" fill="#ffffff"/>';
        inner += '<rect x="350" y="200" width="300" height="100" rx="50" fill="#0284c7" cursor="pointer"/>';
        inner += '<text x="500" y="265" fill="#ffffff" font-size="36" font-weight="bold" text-anchor="middle" cursor="pointer">図版を選択</text>';
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '">' + inner + '</svg>';
      }

      if (state.type === 'funnel_marketing') {
        var blockColor = '#e2e8f0';
        inner += '<polygon points="50,50 120,65 120,435 50,450" fill="'+blockColor+'"/>';
        inner += '<polygon points="135,68 205,83 205,417 135,432" fill="'+blockColor+'"/>';
        inner += '<polygon points="220,86 290,101 290,399 220,414" fill="'+blockColor+'"/>';
        inner += '<polygon points="305,104 375,119 375,381 305,396" fill="'+blockColor+'"/>';
        inner += '<polygon points="390,122 460,137 460,363 390,378" fill="'+blockColor+'"/>';
        inner += '<polygon points="475,140 545,155 545,345 475,360" fill="'+blockColor+'"/>';
        inner += '<polygon points="560,152 630,137 630,363 560,348" fill="'+blockColor+'"/>';
        inner += '<polygon points="645,134 715,119 715,381 645,366" fill="'+blockColor+'"/>';
        inner += '<polygon points="730,116 800,101 800,399 730,384" fill="'+blockColor+'"/>';
        inner += '<polygon points="815,98 885,83 885,417 815,402" fill="'+blockColor+'"/>';
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '">' + inner + '</svg>';
      }

      if (state.type === 'funnel') {
        var topW = 200, botW = 600, layerH = h / count;
        state.items.forEach(function(item, i) {
          var y1 = i * layerH + 5, y2 = (i + 1) * layerH - 5;
          var w1 = topW + (botW - topW) * (i / count);
          var w2 = topW + (botW - topW) * ((i + 1) / count);
          var x1 = (w - w1)/2, x2 = x1 + w1, x3 = (w - w2)/2, x4 = x3 + w2;
          var hex = getItemHex(item), txtCol = getTextColor(hex);
          inner += '<polygon points="' + x1 + ',' + y1 + ' ' + x2 + ',' + y1 + ' ' + x4 + ',' + y2 + ' ' + x3 + ',' + y2 + '" fill="' + hex + '" stroke="' + hex + '" stroke-width="8" stroke-linejoin="round"/>';
          inner += '<text x="' + ((x1+x2)/2) + '" y="' + ((y1+y2)/2+6) + '" fill="'+txtCol+'" font-size="20" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'chevron') {
        var gap = 16, bw = (w - 40 - (count-1)*gap) / count;
        state.items.forEach(function(item, i) {
          var hex = getItemHex(item), txtCol = getTextColor(hex), x = 20 + i * (bw + gap);
          inner += '<rect x="' + x + '" y="100" width="' + bw + '" height="300" fill="' + hex + '" rx="6"/>';
          inner += '<text x="' + (x + bw/2) + '" y="240" fill="' + txtCol + '" font-size="16" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'process_arrow') {
        var gap = 20, arrowW = 40, boxW = (w - (count-1)*(gap*2+arrowW) - 40) / count;
        state.items.forEach(function(item, i) {
          var x = 20 + i * (boxW + gap*2 + arrowW), hex = getItemHex(item), txtCol = getTextColor(hex);
          inner += '<rect x="' + x + '" y="200" width="' + boxW + '" height="100" fill="' + hex + '" rx="8"/>';
          inner += '<text x="' + (x + boxW/2) + '" y="255" fill="' + txtCol + '" font-size="16" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
          if (i < count - 1) inner += '<polygon points="'+(x+boxW+gap)+',235 '+(x+boxW+gap+arrowW)+',250 '+(x+boxW+gap)+',265" fill="#6f6f6f"/>';
        });

      } else if (state.type === 'standalone_arrow') {
        var at = state.arrowType || 'block', strokeW = (state.arrowWeight || 3) * 3 + 2; 
        state.items.forEach(function(item, i) {
          var y = (h - count*120)/2 + i * 120, hex = getItemHex(item);
          if (at === 'line') {
            inner += '<line x1="200" y1="'+(y+30)+'" x2="800" y2="'+(y+30)+'" stroke="'+hex+'" stroke-width="'+strokeW+'"/>';
            inner += '<polygon points="800,'+(y+30-strokeW*1.5)+' '+(800+strokeW*2)+','+(y+30)+' 800,'+(y+30+strokeW*1.5)+'" fill="'+hex+'"/>';
          } else if (at === 'curved_up') {
            inner += '<path d="M 200 '+(y+100)+' Q 500 '+(y+100)+' 800 '+(y+20)+'" fill="none" stroke="'+hex+'" stroke-width="'+strokeW+'"/>';
            inner += '<polygon points="790,'+(y+10)+' '+(810+strokeW)+','+(y+15)+' 800,'+(y+30)+'" fill="'+hex+'"/>';
          } else {
            var bh = (state.arrowWeight || 3) * 8 + 20;
            inner += '<polygon points="200,'+(y+30-bh/2)+' 760,'+(y+30-bh/2)+' 760,'+(y+30-bh/2-10)+' 820,'+(y+30)+' 760,'+(y+30+bh/2+10)+' 760,'+(y+30+bh/2)+' 200,'+(y+30+bh/2)+'" fill="'+hex+'"/>';
          }
        });

      } else if (state.type === 'pyramid') {
        var botW = 600, layerH = h / count;
        for (var i = count - 1; i >= 0; i--) {
          var item = state.items[i], currentH = layerH * (i + 1), currentW = botW * ((i + 1) / count), lx = (w - currentW) / 2, hex = getItemHex(item);
          inner += '<polygon points="' + (w/2) + ',0 ' + (lx+currentW) + ',' + currentH + ' ' + lx + ',' + currentH + '" fill="' + hex + '" stroke="#fff" stroke-width="2"/>';
        }
        for (var i = count - 1; i >= 0; i--) {
           var item = state.items[i], textY = (layerH * (i + 1)) - (layerH / 2) + 6, hex = getItemHex(item), txtCol = getTextColor(hex);
           inner += '<text x="' + (w/2) + '" y="' + textY + '" fill="'+txtCol+'" font-size="18" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        }

      } else if (state.type === 'matrix') {
        var gap = 15, bw = 380, bh = 180, pos = [ {x: 500+gap, y: 250-bh-gap}, {x: 500-bw-gap, y: 250-bh-gap}, {x: 500-bw-gap, y: 250+gap}, {x: 500+gap, y: 250+gap} ];
        state.items.slice(0, 4).forEach(function(item, i) {
          var hex = getItemHex(item), txtCol = getTextColor(hex), p = pos[i];
          inner += '<rect x="' + p.x + '" y="' + p.y + '" width="' + bw + '" height="' + bh + '" fill="' + hex + '" rx="8"/>';
          inner += '<text x="' + (p.x + 20) + '" y="' + (p.y + 40) + '" fill="' + txtCol + '" font-size="18" font-weight="bold">' + escapeHtml(item.title) + '</text>';
          inner += '<text x="' + (p.x + 20) + '" y="' + (p.y + 80) + '" fill="' + txtCol + '" font-size="14">' + escapeHtml(item.desc) + '</text>';
        });

      } else if (state.type === 'cycle') {
        var cx = w / 2, cy = h / 2, r = 140;
        inner += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#6F6F6F" stroke-width="6"/>';
        state.items.forEach(function(item, i) {
          var angle = (i * 2 * Math.PI / count) - (Math.PI / 2), x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle), hex = getItemHex(item), txtCol = getTextColor(hex);
          inner += '<circle cx="' + x + '" cy="' + y + '" r="45" fill="' + hex + '" stroke="#fff" stroke-width="2"/>';
          inner += '<text x="' + x + '" y="' + (y + 6) + '" fill="' + txtCol + '" font-size="14" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'onion') {
        var cx = w / 2 - 150, cy = h / 2, maxR = 200, stepR = maxR / count;
        for (var i = count - 1; i >= 0; i--) {
          var cr = stepR * (i + 1), hex = getItemHex(state.items[i]);
          inner += '<circle cx="' + cx + '" cy="' + cy + '" r="' + cr + '" fill="' + hex + '" stroke="#fff" stroke-width="2"/>';
        }
        state.items.forEach(function(item, i) {
          var ty = cy - maxR + (i * (maxR * 2 / count)) + 20, tx = cx + maxR + 30;
          inner += '<text x="' + tx + '" y="' + ty + '" fill="#070322" font-size="16" font-weight="bold">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'venn') {
        var cy = h / 2, r = 120, ac = Math.min(count, 3);
        var centers = ac >= 3 ? [{x: w/2 - 60, y: cy - 40}, {x: w/2 + 60, y: cy - 40}, {x: w/2, y: cy + 60}] : [{x: w/2 - 70, y: cy}, {x: w/2 + 70, y: cy}];
        for(var i=0; i<ac; i++) {
          var hex = getItemHex(state.items[i]), txtCol = getTextColor(hex), cx = centers[i].x, cyc = centers[i].y;
          inner += '<circle cx="' + cx + '" cy="' + cyc + '" r="' + r + '" fill="' + hex + '" opacity="0.85" stroke="#fff" stroke-width="2"/>';
          var ny = (ac>=3 && i===2) ? cyc + 30 : cyc - 40;
          var nx = (ac>=3 && i===0) ? cx - 20 : (ac>=3 && i===1) ? cx + 20 : cx;
          inner += '<text x="' + nx + '" y="' + ny + '" fill="' + txtCol + '" font-size="16" font-weight="bold" text-anchor="middle">' + escapeHtml(state.items[i].title) + '</text>';
        }
        inner += '<text x="'+(w/2)+'" y="'+(cy-10)+'" fill="#070322" font-size="14" font-weight="bold" text-anchor="middle">[重なり]</text>';

      } else if (state.type === 'timeline') {
        inner += '<line x1="100" y1="250" x2="900" y2="250" stroke="#6F6F6F" stroke-width="6"/>';
        var stepW = 800 / Math.max(1, count - 1);
        state.items.forEach(function(item, i) {
          var x = 100 + i * stepW, hex = getItemHex(item), txtCol = getTextColor(hex), cy = (i % 2 === 0) ? 140 : 310;
          inner += '<circle cx="' + x + '" cy="250" r="14" fill="' + hex + '" stroke="#fff" stroke-width="3"/>';
          inner += '<rect x="' + (x - 70) + '" y="' + cy + '" width="140" height="70" fill="' + hex + '" rx="8"/>';
          inner += '<text x="' + x + '" y="' + (cy + 35) + '" fill="' + txtCol + '" font-size="13" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'comparison') {
        var colW = 220, gap=20, totalW = count * colW + (count-1)*gap, startX = (w - totalW) / 2;
        state.items.forEach(function(item, i) {
          var x = startX + i * (colW + gap), hex = getItemHex(item), txtCol = getTextColor(hex);
          inner += '<rect x="' + x + '" y="100" width="' + colW + '" height="250" fill="#fafafa" stroke="'+hex+'" stroke-width="2"/>';
          inner += '<rect x="' + x + '" y="100" width="' + colW + '" height="40" fill="' + hex + '"/>';
          inner += '<text x="' + (x + colW/2) + '" y="125" fill="' + txtCol + '" font-size="16" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
          inner += '<text x="' + (x + 15) + '" y="170" fill="#070322" font-size="13">' + escapeHtml(item.desc) + '</text>';
        });

      } else if (state.type === 'list_overlap') {
        var startY = (h - count * 100) / 2, barW = 700;
        state.items.forEach(function(item, i) {
          var y = startY + i * 100, hex = getItemHex(item), txtCol = getTextColor(hex);
          inner += '<rect x="' + (500 - barW/2 + 30) + '" y="'+y+'" width="'+(barW-30)+'" height="50" rx="25" fill="'+hex+'"/>';
          inner += '<circle cx="' + (500 - barW/2 + 10) + '" cy="'+(y+25)+'" r="40" fill="#fff" stroke="'+hex+'" stroke-width="6"/>';
          inner += '<text x="' + (500 - barW/2 + 10) + '" y="'+(y+25)+'" fill="'+hex+'" font-size="28" font-weight="bold" text-anchor="middle" dominant-baseline="central">' + (i+1) + '</text>';
          inner += '<text x="' + (500 - barW/2 + 80) + '" y="'+(y+32)+'" fill="'+txtCol+'" font-size="20" font-weight="bold">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'list_number') {
        var startY = (h - count * 80) / 2, barW = 700;
        state.items.forEach(function(item, i) {
          var y = startY + i * 80, hex = getItemHex(item);
          inner += '<text x="' + (500 - barW/2) + '" y="'+(y+35)+'" fill="'+hex+'" font-size="36" font-weight="bold">' + (i+1) + '</text>';
          inner += '<rect x="' + (500 - barW/2 + 60) + '" y="'+(y)+'" width="'+(barW-60)+'" height="40" rx="20" fill="'+hex+'" opacity="0.2"/>';
          inner += '<text x="' + (500 - barW/2 + 90) + '" y="'+(y+28)+'" fill="'+hex+'" font-size="20" font-weight="bold">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'step_card') {
        var gap = 20, cardW = 200, totalW = count * cardW + (count - 1) * gap, startX = (w - totalW) / 2, y = 100;
        state.items.forEach(function(item, i) {
          var x = startX + i * (cardW + gap), hex = getItemHex(item);
          inner += '<rect x="'+x+'" y="'+y+'" width="'+cardW+'" height="280" rx="10" fill="'+hex+'" opacity="0.15"/>';
          inner += '<circle cx="'+(x+cardW/2)+'" cy="'+y+'" r="45" fill="'+hex+'"/>';
          inner += '<text x="'+(x+cardW/2)+'" y="'+(y-5)+'" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Step</text>';
          inner += '<text x="'+(x+cardW/2)+'" y="'+(y+25)+'" fill="#fff" font-size="28" font-weight="bold" text-anchor="middle">' + (i+1) + '</text>';
          inner += '<text x="'+(x+cardW/2)+'" y="'+(y+70)+'" fill="#070322" font-size="18" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });
      }

      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '">' + inner + '</svg>';
    }

    function updatePreview() { 
      var box = document.getElementById('previewBox');
      box.innerHTML = generateSVG(); 
      if (state.type === 'initial') {
        box.classList.add('is-initial');
        box.classList.remove('has-diagram');
      } else {
        box.classList.remove('is-initial');
        box.classList.add('has-diagram');
      }
    }
    
    function updateAll() { renderInputs(); updatePreview(); }

    function getShapeType(key) {
      if (typeof PowerPoint !== 'undefined' && PowerPoint.GeometricShapeType) {
        var GST = PowerPoint.GeometricShapeType;
        var map = { 'rectangle': GST.rectangle, 'roundRectangle': GST.roundRectangle, 'trapezoid': GST.trapezoid, 'chevron': GST.chevron, 'rightArrow': GST.rightArrow, 'curvedUpArrow': GST.bentUpArrow || GST.curvedUpArrow, 'triangle': GST.triangle, 'ellipse': GST.ellipse };
        if (map[key]) return map[key];
      }
      var fallbackMap = { 'rectangle': 'Rectangle', 'roundRectangle': 'RoundRectangle', 'trapezoid': 'Trapezoid', 'chevron': 'Chevron', 'rightArrow': 'RightArrow', 'curvedUpArrow': 'BentUpArrow', 'triangle': 'Triangle', 'ellipse': 'Ellipse' };
      return fallbackMap[key] || 'Rectangle';
    }

    // ▼ 中央揃え制御を追加した拡張addText関数
    function addText(shape, text, color, size, bold, hAlign, vAlign) {
      if (shape && shape.textFrame && shape.textFrame.textRange) {
        shape.textFrame.textRange.text = text || '';
        if (color) shape.textFrame.textRange.font.color = color;
        if (size) shape.textFrame.textRange.font.size = size;
        shape.textFrame.textRange.font.bold = (bold !== undefined) ? bold : true;
        
        // テキストの水平・垂直揃え
        if (hAlign) shape.textFrame.textRange.paragraphFormat.horizontalAlignment = hAlign;
        if (vAlign) shape.textFrame.verticalAlignment = vAlign;
      }
    }

              } else if (state.type === 'process_arrow') {
                var gap = 10, arrowW = 20, boxW = (totalWidth - (count - 1) * (gap * 2 + arrowW)) / count;
                for (var i = 0; i < count; i++) {
                  var item = payloadItems[i], curLeft = startLeft + i * (boxW + gap * 2 + arrowW);
                  var shape = shapes.addGeometricShape(getShapeType('roundRectangle'), { left: curLeft, top: startTop + 60, width: boxW, height: 100 });
                  shape.fill.setSolidColor(item.hex); 
                  shape.lineFormat.visible = false;
                  addText(shape, item.title, item.textColor, 13, true, "Center", "Middle");
                  
                  if (item.desc) {
                    var descBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: curLeft - 10, top: startTop + 165, width: boxW + 20, height: 50 });
                    descBox.fill.clear(); descBox.lineFormat.visible = false; 
                    addText(descBox, item.desc, "#6F6F6F", 11, false, "Center", "Top");
                  }

                  if (i < count - 1) {
                    var arrow = shapes.addGeometricShape(getShapeType('rightArrow'), { left: curLeft + boxW + gap, top: startTop + 95, width: arrowW, height: 30 });
                    arrow.fill.setSolidColor("#6F6F6F"); 
                    arrow.lineFormat.visible = false;
                  }
                }
              } else if (state.type === 'standalone_arrow') {
                var gap = 15, layerH = (totalHeight - (count - 1) * gap) / count, at = state.arrowType || 'block';
                for (var i = 0; i < count; i++) {
                  var item = payloadItems[i], sType = getShapeType('rightArrow'), w = totalWidth, h = layerH, t = startTop + i * (layerH + gap);
                  if (at === 'line') { h = Math.max(8, (state.arrowWeight || 3) * 4); t = t + (layerH - h) / 2; } else if (at === 'curved_up') { sType = getShapeType('curvedUpArrow'); }
                  var shape = shapes.addGeometricShape(sType, { left: startLeft, top: t, width: w, height: h });
                  shape.fill.setSolidColor(item.hex); 
                  shape.lineFormat.visible = false;
                }
              } else if (state.type === 'pyramid') {
                var botW = 560, layerH = totalHeight / count;
                for (var i = count - 1; i >= 0; i--) {
                  var item = payloadItems[i], curW = botW * ((i + 1) / count), curH = totalHeight * ((i + 1) / count);
                  var shape = shapes.addGeometricShape(getShapeType('triangle'), { left: startLeft + (totalWidth - curW) / 2, top: startTop, width: curW, height: curH });
                  shape.fill.setSolidColor(item.hex); 
                  shape.lineFormat.color = "#FFFFFF";
                  shape.lineFormat.weight = 2;
                  
                  var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: startLeft, top: startTop + i * layerH, width: totalWidth, height: layerH });
                  txtBox.fill.clear(); txtBox.lineFormat.visible = false;
                  addText(txtBox, item.title, item.textColor, 14, true, "Center", "Bottom");
                  
                  if (item.desc) {
                    var descBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: startLeft + totalWidth + 20, top: startTop + i * layerH, width: 200, height: layerH });
                    descBox.fill.clear(); descBox.lineFormat.visible = false;
                    addText(descBox, item.desc, "#6F6F6F", 12, false, "Left", "Bottom");
                  }
                }
              } else if (state.type === 'matrix') {
                var gap = 15, bw = (totalWidth - gap) / 2, bh = 140, pos = [{l:startLeft+bw+gap, t:startTop}, {l:startLeft, t:startTop}, {l:startLeft, t:startTop+bh+gap}, {l:startLeft+bw+gap, t:startTop+bh+gap}];
                for (var i = 0; i < Math.min(count, 4); i++) {
                  var item = payloadItems[i], p = pos[i];
                  var shape = shapes.addGeometricShape(getShapeType('roundRectangle'), { left: p.l, top: p.t, width: bw, height: bh });
                  shape.fill.setSolidColor(item.hex); 
                  shape.lineFormat.color = "#FFFFFF";
                  shape.lineFormat.weight = 2;
                  
                  var titleBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: p.l + 10, top: p.t + 10, width: bw - 20, height: 30 });
                  titleBox.fill.clear(); titleBox.lineFormat.visible = false; 
                  addText(titleBox, item.title, item.textColor, 14, true, "Left", "Middle");
                  
                  if (item.desc) {
                    var descBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: p.l + 10, top: p.t + 40, width: bw - 20, height: bh - 50 });
                    descBox.fill.clear(); descBox.lineFormat.visible = false; 
                    addText(descBox, item.desc, item.textColor, 11, false, "Left", "Top");
                  }
                }
              } else if (state.type === 'venn') {
                var r = 200, ac = Math.min(count, 3), cx = startLeft + totalWidth / 2, cy = startTop + totalHeight / 2;
                var pos = ac >= 3 ? [ { x: cx - 50, y: cy - 35 }, { x: cx + 50, y: cy - 35 }, { x: cx, y: cy + 50 } ] : [ { x: cx - 70, y: cy }, { x: cx + 70, y: cy } ];
                for (var i = 0; i < ac; i++) {
                  var item = payloadItems[i];
                  var shape = shapes.addGeometricShape(getShapeType('ellipse'), { left: pos[i].x - r/2, top: pos[i].y - r/2, width: r, height: r });
                  shape.fill.setSolidColor(item.hex); 
                  shape.lineFormat.color = "#FFFFFF";
                  shape.lineFormat.weight = 2;
                }
                var overlapBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: cx - 50, top: cy - 15, width: 100, height: 30 });
                overlapBox.fill.clear(); overlapBox.lineFormat.visible = false; 
                addText(overlapBox, "[重なり]", "#000000", 12, true, "Center", "Middle");
                var txtPos = ac >= 3 ? [ { x: cx - 80, y: cy - 70 }, { x: cx + 80, y: cy - 70 }, { x: cx, y: cy + 90 } ] : [ { x: cx - 100, y: cy }, { x: cx + 100, y: cy } ];
                for (var i = 0; i < ac; i++) {
                  var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: txtPos[i].x - 50, top: txtPos[i].y - 15, width: 100, height: 30 });
                  txtBox.fill.clear(); txtBox.lineFormat.visible = false; 
                  addText(txtBox, payloadItems[i].title, "#000000", 13, true, "Center", "Middle");
                }
              } else if (state.type === 'comparison') {
                var gap = 20, colW = (totalWidth - (count - 1) * gap) / count;
                if (colW * count + gap * (count - 1) > 850) colW = (850 - gap * (count - 1)) / count;
                for (var i = 0; i < count; i++) {
                  var item = payloadItems[i], curLeft = startLeft + i * (colW + gap);
                  var head = shapes.addGeometricShape(getShapeType('rectangle'), { left: curLeft, top: startTop, width: colW, height: 40 });
                  head.fill.setSolidColor(item.hex); head.lineFormat.visible = false; 
                  addText(head, item.title, item.textColor, 13, true, "Center", "Middle");
                  
                  var body = shapes.addGeometricShape(getShapeType('rectangle'), { left: curLeft, top: startTop+45, width: colW, height: totalHeight-45 });
                  body.fill.setSolidColor("#FAFAFA"); 
                  body.lineFormat.color = item.hex;
                  body.lineFormat.weight = 2;
                  addText(body, item.desc, "#000000", 11, false, "Left", "Top");
                }
              } else if (state.type === 'cycle') {
                var cx = startLeft + totalWidth / 2, cy = startTop + totalHeight / 2, r = 100;
                var track = shapes.addGeometricShape(getShapeType('ellipse'), { left: cx - r, top: cy - r, width: r * 2, height: r * 2 });
                track.fill.clear(); 
                track.lineFormat.color = "#CBD5E1";
                track.lineFormat.weight = 3;
                for (var i = 0; i < count; i++) {
                  var item = payloadItems[i], angle = (i * 2 * Math.PI / count) - (Math.PI / 2), nx = cx + r * Math.cos(angle), ny = cy + r * Math.sin(angle);
                  var shape = shapes.addGeometricShape(getShapeType('ellipse'), { left: nx - 30, top: ny - 30, width: 60, height: 60 });
                  shape.fill.setSolidColor(item.hex); 
                  shape.lineFormat.color = "#FFFFFF";
                  shape.lineFormat.weight = 2;
                  
                  var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: nx - 60, top: ny + 32, width: 120, height: 30 });
                  txtBox.fill.clear(); txtBox.lineFormat.visible = false; 
                  addText(txtBox, item.title, "#000000", 12, true, "Center", "Top");
                }
              } else if (state.type === 'onion') {
                var cx = startLeft + totalWidth / 2 - 40, cy = startTop + totalHeight / 2, maxR = Math.min(totalWidth / 2, totalHeight / 2);
                for (var i = count - 1; i >= 0; i--) {
                  var item = payloadItems[i], cr = (maxR / count) * (i + 1);
                  var shape = shapes.addGeometricShape(getShapeType('ellipse'), { left: cx - cr, top: cy - cr, width: cr * 2, height: cr * 2 });
                  shape.fill.setSolidColor(item.hex); 
                  shape.lineFormat.color = "#FFFFFF";
                  shape.lineFormat.weight = 1.5;
                  
                  var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: cx - cr, top: cy - cr + 5, width: cr * 2, height: 25 });
                  txtBox.fill.clear(); txtBox.lineFormat.visible = false; 
                  addText(txtBox, item.title, item.textColor, 12, true, "Center", "Middle");
                  
                  if (item.desc) {
                    var descBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: cx + maxR + 20, top: cy - cr + (cr*2)/count, width: 200, height: 30 });
                    descBox.fill.clear(); descBox.lineFormat.visible = false; 
                    addText(descBox, item.desc, "#6F6F6F", 11, false, "Left", "Middle");
                  }
                }
              } else if (state.type === 'timeline') {
                var lineY = startTop + totalHeight / 2;
                var line = shapes.addGeometricShape(getShapeType('rightArrow'), { left: startLeft, top: lineY - 8, width: totalWidth, height: 16 });
                line.fill.setSolidColor("#CBD5E1"); line.lineFormat.visible = false; 
                var stepW = totalWidth / (count + 0.5);
                for (var i = 0; i < count; i++) {
                  var item = payloadItems[i], x = startLeft + 35 + i * stepW, isTop = (i % 2 === 0), stemH = 45, stemY = isTop ? lineY - stemH : lineY;
                  var stem = shapes.addGeometricShape(getShapeType('rectangle'), { left: x - 1, top: stemY, width: 2, height: stemH });
                  stem.fill.setSolidColor("#94A3B8"); stem.lineFormat.visible = false; 
                  var dot = shapes.addGeometricShape(getShapeType('ellipse'), { left: x - 10, top: lineY - 10, width: 20, height: 20 });
                  dot.fill.setSolidColor(item.hex); 
                  dot.lineFormat.color = "#FFFFFF";
                  dot.lineFormat.weight = 2;
                  
                  var boxY = isTop ? lineY - stemH - 60 : lineY + stemH;
                  var titleBox = shapes.addGeometricShape(getShapeType('roundRectangle'), { left: x - 55, top: boxY, width: 110, height: 30 });
                  titleBox.fill.clear(); titleBox.lineFormat.visible = false; 
                  addText(titleBox, item.title, "#000000", 12, true, "Center", "Middle");
                  
                  if (item.desc) {
                    var descBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: x - 65, top: boxY + 25, width: 130, height: 40 });
                    descBox.fill.clear(); descBox.lineFormat.visible = false; 
                    addText(descBox, item.desc, "#6F6F6F", 10, false, "Center", "Top");
                  }
                }
                
              } else if (state.type === 'list_overlap') {
                var stepY = totalHeight / count;
                var barW = totalWidth - 40, barH = Math.min(40, stepY - 10), circleR = barH + 10;
                var startX = startLeft + 20;
                for (var i = 0; i < count; i++) {
                  var item = payloadItems[i], y = startTop + i * stepY + (stepY - barH) / 2;
                  
                  var bar = shapes.addGeometricShape(getShapeType('roundRectangle'), { left: startX + 25, top: y, width: barW - 25, height: barH });
                  bar.fill.setSolidColor(item.hex); bar.lineFormat.visible = false;
                  
                  var titleBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: startX + 60, top: y + 5, width: barW - 70, height: 30 });
                  titleBox.fill.clear(); titleBox.lineFormat.visible = false;
                  addText(titleBox, item.title, item.textColor, 13, true, "Left", "Middle");
                  
                  var circle = shapes.addGeometricShape(getShapeType('ellipse'), { left: startX, top: y - (circleR - barH)/2, width: circleR, height: circleR });
                  circle.fill.setSolidColor("#FFFFFF"); 
                  circle.lineFormat.color = blendWithWhite(item.hex, 0.7);
                  circle.lineFormat.weight = 2;
                  
                  var numBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: startX, top: y - (circleR - barH)/2, width: circleR, height: circleR });
                  numBox.fill.clear(); numBox.lineFormat.visible = false;
                  addText(numBox, (i + 1).toString(), item.hex, 16, true, "Center", "Middle");
                  
                  if (item.desc) {
                    var descBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: startX + 60, top: y + barH + 5, width: barW - 70, height: 35 });
                    descBox.fill.clear(); descBox.lineFormat.visible = false;
                    addText(descBox, item.desc, "#6F6F6F", 11, false, "Left", "Top");
                  }
                }
                
              } else if (state.type === 'list_number') {
                var stepY = totalHeight / count;
                var numW = 40, barW = totalWidth - numW - 10, barH = Math.min(40, stepY - 10);
                for (var i = 0; i < count; i++) {
                  var item = payloadItems[i], y = startTop + i * stepY + (stepY - barH) / 2;
                  
                  var numBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: startLeft, top: y, width: numW, height: barH });
                  numBox.fill.clear(); numBox.lineFormat.visible = false;
                  addText(numBox, (i + 1).toString(), item.hex, 24, true, "Center", "Middle");
                  
                  var lightBg = blendWithWhite(item.hex, 0.85);
                  var bar = shapes.addGeometricShape(getShapeType('roundRectangle'), { left: startLeft + numW + 10, top: y, width: barW, height: barH });
                  bar.fill.setSolidColor(lightBg); bar.lineFormat.visible = false;
                  
                  var titleBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: startLeft + numW + 20, top: y + 5, width: barW - 20, height: 30 });
                  titleBox.fill.clear(); titleBox.lineFormat.visible = false;
                  addText(titleBox, item.title, item.hex, 13, true, "Left", "Middle");
                }
                
              } else if (state.type === 'step_card') {
                var gap = 20, cardW = (totalWidth - (count - 1) * gap) / count, cardH = totalHeight - 30;
                if (cardW > 180) cardW = 180; 
                var actualTotalW = count * cardW + (count - 1) * gap;
                var adjustedStartLeft = startLeft + (totalWidth - actualTotalW) / 2;
                var badgeR = 50;
                
                for (var i = 0; i < count; i++) {
                  var item = payloadItems[i], x = adjustedStartLeft + i * (cardW + gap);
                  var lightBg = blendWithWhite(item.hex, 0.88);
                  
                  var card = shapes.addGeometricShape(getShapeType('roundRectangle'), { left: x, top: startTop + 30, width: cardW, height: cardH });
                  card.fill.setSolidColor(lightBg); card.lineFormat.visible = false;
                  
                  var badgeY = startTop + 30 - badgeR/2;
                  var badgeX = x + cardW/2 - badgeR/2;
                  var badge = shapes.addGeometricShape(getShapeType('ellipse'), { left: badgeX, top: badgeY, width: badgeR, height: badgeR });
                  badge.fill.setSolidColor(item.hex); badge.lineFormat.visible = false;
                  
                  var badgeTxt = shapes.addGeometricShape(getShapeType('rectangle'), { left: badgeX, top: badgeY + 5, width: badgeR, height: badgeR });
                  badgeTxt.fill.clear(); badgeTxt.lineFormat.visible = false;
                  addText(badgeTxt, "Step\n" + (i + 1), "#FFFFFF", 11, true, "Center", "Middle");
                  
                  var titleBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: x + 5, top: startTop + 60, width: cardW - 10, height: 40 });
                  titleBox.fill.clear(); titleBox.lineFormat.visible = false;
                  addText(titleBox, item.title, "#000000", 13, true, "Center", "Middle");
                  
                  if (item.desc) {
                    var descBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: x + 5, top: startTop + 100, width: cardW - 10, height: cardH - 80 });
                    descBox.fill.clear(); descBox.lineFormat.visible = false;
                    addText(descBox, item.desc, "#000000", 11, false, "Center", "Top");
                  }
                }
              }

              await context.sync();
              log('✔ 挿入完了しました。');
            }
            
            // 挿入成功後、UIを初期画面に戻す
            changeType('initial');
            
          });
        } else {
          log('PowerPoint環境外です。', true);
        }
      } catch (e) {
        var errorMsg = e.message || (e.error ? e.error.message : JSON.stringify(e)) || String(e);
        log('挿入エラー: ' + errorMsg, true);
        console.error(e);
      } finally {
        btn.disabled = false; btn.textContent = 'スライドに挿入';
      }
    }

    try {
      initModal();
      var fw = frameworkTypes.find(f => f.id === state.type);
      document.getElementById('currentTypeName').innerText = fw ? fw.name : '図版を選択してください';
      renderDetailSettings();
      updateAll();
      log('準備完了。UIを改善しました。');
    } catch(e) { log('初期化エラー: ' + e.message, true); }
  </script>
</body>
</html>
