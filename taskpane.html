<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>構造図ジェネレーター for PowerPoint</title>
  <!-- Office.js ライブラリ -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 10px; font-size: 12px; }
    .header { font-weight: bold; font-size: 14px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #334155; color: #38bdf8; }
    .section { margin-bottom: 10px; }
    .label { font-weight: bold; color: #94a3b8; margin-bottom: 4px; display: block; font-size: 11px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .btn-theme { background: #1e293b; border: 1px solid #475569; color: #94a3b8; padding: 6px; border-radius: 4px; text-align: left; cursor: pointer; font-size: 10px; }
    .btn-theme.active { border-color: #38bdf8; background: #0284c7; color: #fff; font-weight: bold; }
    select, input[type="text"] { width: 100%; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 6px; border-radius: 4px; font-size: 11px; margin-bottom: 4px; outline:none; }
    
    .card { background: #1e293b; border: 1px solid #334155; padding: 8px; border-radius: 4px; margin-bottom: 6px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: #94a3b8; font-size: 10px; }
    
    .color-ui { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; background: #0f172a; padding: 6px; border-radius: 4px; border: 1px solid #475569; }
    .hue-btns { display: flex; gap: 4px; }
    .btn-hue { flex: 1; border: 1px solid #475569; background: #1e293b; color: #cbd5e1; padding: 4px 0; border-radius: 3px; cursor: pointer; font-size: 9px; text-align: center; }
    .btn-hue.active { border-color: #38bdf8; font-weight: bold; color: #fff; background: #0284c7; }
    .slider-row { display: flex; align-items: center; gap: 8px; }
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #38bdf8; cursor: pointer; margin-top: -4px; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #475569; border-radius: 2px; }

    .preview-box { background: #fafafa; border-radius: 4px; padding: 4px; margin-bottom: 8px; min-height: 110px; display: flex; align-items: center; justify-content: center; overflow:hidden;}
    .preview-box svg { width: 100%; height: auto; max-height: 140px; }
    .btn-primary { width: 100%; background: #0284c7; border: none; color: #fff; font-weight: bold; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 4px; }
    .btn-primary:disabled { background: #475569; cursor: not-allowed; }
    .btn-add { background: #0284c7; color: #fff; border: none; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; }
    .btn-del { background: #ef4444; color: #fff; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 10px; }
    
    .detail-box { background: #1e293b; padding: 6px; border-radius: 4px; border: 1px solid #334155; margin-bottom: 6px; }
    .notice { font-size: 9px; color: #94a3b8; margin-top: 2px; }
    #logArea { margin-top: 6px; padding: 6px; border-radius: 4px; font-size: 10px; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; max-height: 70px; overflow-y: auto; word-break: break-all; }
  </style>
</head>
<body>

  <div class="header">構造図ジェネレーター for PPT</div>

  <div class="section">
    <span class="label">プレビュー</span>
    <div class="preview-box" id="previewBox"></div>
  </div>

  <div class="section">
    <span class="label">1. セグメント・カラー</span>
    <div class="grid">
      <button id="btn-corporate" onclick="selectTheme('corporate')" class="btn-theme active">全社基本 (#da3f24)</button>
      <button id="btn-pmo" onclick="selectTheme('pmo')" class="btn-theme">戦略PMO (#313C58)</button>
      <button id="btn-fandom" onclick="selectTheme('fandom')" class="btn-theme">ファンダム (#C3446E)</button>
      <button id="btn-sns" onclick="selectTheme('sns')" class="btn-theme">SNS統合 (#265A7A)</button>
    </div>
  </div>

  <div class="section">
    <span class="label">2. フレームワーク (全11種類)</span>
    <select id="typeSelect" onchange="changeType(this.value)">
      <optgroup label="プロセス・段階">
        <option value="funnel">1. パーチェスファネル（台形重ね）</option>
        <option value="chevron">2. シェブロン（横ステップ）</option>
        <option value="process_arrow">3. 矢印付きプロセス</option>
        <option value="standalone_arrow">4. 単体カスタム矢印</option>
        <option value="pyramid">5. ピラミッド（三角形重ね）</option>
      </optgroup>
      <optgroup label="分析・分類">
        <option value="matrix">6. 2x2 マトリクス</option>
        <option value="venn">7. 3C / 2C ベン図</option>
        <option value="comparison">8. カラム比較</option>
      </optgroup>
      <optgroup label="関係性・流れ">
        <option value="cycle">9. 循環 / ループ（PDCA）</option>
        <option value="onion">10. 同心円（オニオン構造）</option>
        <option value="timeline">11. タイムライン</option>
      </optgroup>
    </select>
  </div>

  <div class="section" id="detailSettings" style="display:none;"></div>

  <div class="section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span class="label" style="margin:0;">3. テキスト＆カラー設定</span>
      <button onclick="addItem()" class="btn-add">＋追加</button>
    </div>
    <div id="itemsContainer"></div>
  </div>

  <button id="btnInsert" onclick="insertToSlide()" class="btn-primary">PowerPointに挿入</button>
  <div class="notice">※ 挿入した図形やテキストはスライド上で自由に編集可能です。</div>
  
  <div class="section" style="margin-top:8px;">
    <span class="label">ステータス・ログ</span>
    <div id="logArea">初期化中...</div>
  </div>

  <script>
    // Office.js 初期化
    Office.onReady(function(info) {
      if (info.host === Office.HostType.PowerPoint) {
        log('PowerPointアドイン準備完了');
        renderDetailSettings();
        updateAll();
      } else {
        log('ブラウザプレビュー表示中（PowerPoint外）');
        renderDetailSettings();
        updateAll();
      }
    });

    function log(msg, isError) {
      var el = document.getElementById('logArea');
      if (el) {
        el.innerHTML = '<span style="color:' + (isError ? '#fca5a5' : '#86efac') + ';">[' + (isError ? 'エラー' : '情報') + '] ' + msg + '</span>';
      }
    }

    var state = {
      theme: 'corporate',
      type: 'funnel',
      arrowType: 'block',
      arrowWeight: 3,
      items: [
        { title: '認知', desc: 'マスメディア・SNS', hue: 'gray', shade: 4 },
        { title: '興味・関心', desc: 'オウンドメディア訪問', hue: 'gray', shade: 4 },
        { title: '比較・検討', desc: '資料請求・セミナー', hue: 'main', shade: 1 },
        { title: '購買', desc: '新規契約・購買層', hue: 'accent', shade: 0 }
      ]
    };

    var palettes = {
      corporate: { main: '#da3f24', accent: '#ff5d40' },
      pmo: { main: '#313C58', accent: '#da3f24' },
      fandom: { main: '#C3446E', accent: '#e4007f' },
      sns: { main: '#265A7A', accent: '#da3f24' }
    };

    function blendWithWhite(hex, percent) {
      var r = parseInt(hex.substring(1,3), 16), g = parseInt(hex.substring(3,5), 16), b = parseInt(hex.substring(5,7), 16);
      r = Math.round(r + (255 - r) * percent);
      g = Math.round(g + (255 - g) * percent);
      b = Math.round(b + (255 - b) * percent);
      return '#' + [r,g,b].map(function(x){ return x.toString(16).padStart(2,'0') }).join('');
    }

    function getItemHex(item) {
      var p = palettes[state.theme];
      var baseHex = '#6F6F6F';
      if (item.hue === 'main') baseHex = p.main;
      if (item.hue === 'accent') baseHex = p.accent;
      var steps = [0, 0.2, 0.45, 0.7, 0.92]; 
      return blendWithWhite(baseHex, steps[item.shade]);
    }

    function getTextColor(hex) {
      var r = parseInt(hex.substring(1,3), 16), g = parseInt(hex.substring(3,5), 16), b = parseInt(hex.substring(5,7), 16);
      var yiq = (r * 299 + g * 587 + b * 114) / 1000;
      return (yiq >= 160) ? '#070322' : '#ffffff';
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function selectTheme(name) {
      state.theme = name;
      ['corporate', 'pmo', 'fandom', 'sns'].forEach(function(t) {
        var btn = document.getElementById('btn-' + t);
        if (btn) btn.classList.toggle('active', t === name);
      });
      updateAll();
    }

    function changeType(val) {
      state.type = val;
      renderDetailSettings();
      updateAll();
    }

    function updateArrowType(val) {
      state.arrowType = val;
      updatePreview();
    }

    function updateArrowWeight(val) {
      state.arrowWeight = parseInt(val, 10);
      updatePreview();
    }

    function renderDetailSettings() {
      var sec = document.getElementById('detailSettings');
      var html = '';
      if (state.type === 'standalone_arrow') {
        html += '<div class="detail-box"><span class="label">▶ 矢印の種類</span>' +
                '<select onchange="updateArrowType(this.value)">' +
                '<option value="block">ブロック矢印</option>' +
                '<option value="line">直線矢印（線）</option>' +
                '<option value="curved_up">曲線矢印（右上り）</option></select>' +
                '<span class="label" style="margin-top:6px;">▶ 矢印の太さ</span>' +
                '<div class="slider-row"><span style="font-size:10px;color:#cbd5e1;">細</span>' +
                '<input type="range" min="1" max="5" value="' + state.arrowWeight + '" oninput="updateArrowWeight(this.value)">' +
                '<span style="font-size:10px;color:#cbd5e1;">太</span></div>' +
                '</div>';
        state.arrowType = 'block';
      }
      sec.innerHTML = html;
      sec.style.display = html ? 'block' : 'none';
    }

    function addItem() {
      state.items.push({ title: '新規項目', desc: '説明テキスト', hue: 'gray', shade: 4 });
      updateAll();
    }

    function removeItem(idx) {
      if (state.items.length <= 1) { log('最低1つ必要です', true); return; }
      state.items.splice(idx, 1);
      updateAll();
    }

    function updateTitle(idx, val) { state.items[idx].title = val; updatePreview(); }
    function updateDesc(idx, val) { state.items[idx].desc = val; updatePreview(); }
    function setHue(idx, hueVal) { state.items[idx].hue = hueVal; renderInputs(); updatePreview(); }
    function setShade(idx, shadeVal) { state.items[idx].shade = parseInt(shadeVal, 10); updatePreview(); }

    function renderInputs() {
      var container = document.getElementById('itemsContainer');
      var html = '';
      state.items.forEach(function(item, index) {
        var hue = item.hue;
        html += '<div class="card">' +
          '<div class="card-head"><span>#' + (index + 1) + '</span>' +
          '<button class="btn-del" onclick="removeItem(' + index + ')">削除</button></div>' +
          '<div class="color-ui">' +
            '<div class="hue-btns">' +
              '<button class="btn-hue ' + (hue==='main'?'active':'') + '" onclick="setHue(' + index + ',\'main\')">メイン</button>' +
              '<button class="btn-hue ' + (hue==='accent'?'active':'') + '" onclick="setHue(' + index + ',\'accent\')">アクセント</button>' +
              '<button class="btn-hue ' + (hue==='gray'?'active':'') + '" onclick="setHue(' + index + ',\'gray\')">無彩色</button>' +
            '</div>' +
            '<div class="slider-row"><span style="font-size:10px;color:#cbd5e1;">濃</span>' +
              '<input type="range" min="0" max="4" value="' + item.shade + '" oninput="setShade(' + index + ', this.value)">' +
            '<span style="font-size:10px;color:#cbd5e1;">淡</span></div>' +
          '</div>' +
          '<input type="text" value="' + escapeHtml(item.title) + '" oninput="updateTitle(' + index + ', this.value)" placeholder="タイトル">' +
          '<input type="text" value="' + escapeHtml(item.desc) + '" oninput="updateDesc(' + index + ', this.value)" placeholder="説明文">' +
        '</div>';
      });
      container.innerHTML = html;
    }

    function generateSVG() {
      var count = state.items.length, w = 1000, h = 500, inner = '';

      if (state.type === 'funnel') {
        var topW = 600, botW = 200, layerH = h / count;
        state.items.forEach(function(item, i) {
          var y1 = i * layerH, y2 = (i + 1) * layerH;
          var w1 = topW - (topW - botW) * (i / count);
          var w2 = topW - (topW - botW) * ((i + 1) / count);
          var x1 = (w - w1)/2, x2 = x1 + w1, x3 = (w - w2)/2, x4 = x3 + w2;
          var hex = getItemHex(item), txtCol = getTextColor(hex);
          inner += '<polygon points="' + x1 + ',' + (y1+2) + ' ' + x2 + ',' + (y1+2) + ' ' + x4 + ',' + (y2-2) + ' ' + x3 + ',' + (y2-2) + '" fill="' + hex + '" stroke="#fff" stroke-width="2"/>';
          inner += '<text x="' + ((x1+x2)/2) + '" y="' + ((y1+y2)/2+6) + '" fill="'+txtCol+'" font-size="18" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'chevron') {
        var gap = 16;
        var bw = (w - 40 - (count-1)*gap) / count;
        state.items.forEach(function(item, i) {
          var hex = getItemHex(item), txtCol = getTextColor(hex), x = 20 + i * (bw + gap);
          inner += '<rect x="' + x + '" y="100" width="' + bw + '" height="300" fill="' + hex + '" rx="6"/>';
          inner += '<text x="' + (x + bw/2) + '" y="240" fill="' + txtCol + '" font-size="16" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'process_arrow') {
        var gap = 20, arrowW = 40, boxW = (w - (count-1)*(gap*2+arrowW) - 40) / count;
        state.items.forEach(function(item, i) {
          var x = 20 + i * (boxW + gap*2 + arrowW), hex = getItemHex(item), txtCol = getTextColor(hex);
          inner += '<rect x="' + x + '" y="200" width="' + boxW + '" height="100" fill="' + hex + '" rx="8"/>';
          inner += '<text x="' + (x + boxW/2) + '" y="255" fill="' + txtCol + '" font-size="16" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
          if (i < count - 1) {
            inner += '<polygon points="'+(x+boxW+gap)+',235 '+(x+boxW+gap+arrowW)+',250 '+(x+boxW+gap)+',265" fill="#6f6f6f"/>';
          }
        });

      } else if (state.type === 'standalone_arrow') {
        var at = state.arrowType || 'block';
        var strokeW = state.arrowWeight * 3 + 2;
        state.items.forEach(function(item, i) {
          var y = (h - count*120)/2 + i * 120, hex = getItemHex(item), txtCol = getTextColor(hex);
          if (at === 'line') {
            inner += '<line x1="200" y1="'+(y+30)+'" x2="800" y2="'+(y+30)+'" stroke="'+hex+'" stroke-width="'+strokeW+'"/>';
            inner += '<polygon points="800,'+(y+30-strokeW*1.5)+' '+(800+strokeW*2)+','+(y+30)+' 800,'+(y+30+strokeW*1.5)+'" fill="'+hex+'"/>';
            txtCol = '#070322';
          } else if (at === 'curved_up') {
            inner += '<path d="M 200 '+(y+100)+' Q 500 '+(y+100)+' 800 '+(y+20)+'" fill="none" stroke="'+hex+'" stroke-width="'+strokeW+'"/>';
            inner += '<polygon points="790,'+(y+10)+' '+(810+strokeW)+','+(y+15)+' 800,'+(y+30)+'" fill="'+hex+'"/>';
            txtCol = '#070322'; 
          } else {
            var bh = state.arrowWeight * 8 + 20;
            inner += '<polygon points="200,'+(y+30-bh/2)+' 760,'+(y+30-bh/2)+' 760,'+(y+30-bh/2-10)+' 820,'+(y+30)+' 760,'+(y+30+bh/2+10)+' 760,'+(y+30+bh/2)+' 200,'+(y+30+bh/2)+'" fill="'+hex+'"/>';
          }
          inner += '<text x="500" y="' + (y + 36) + '" fill="' + txtCol + '" font-size="18" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'pyramid') {
        var botW = 600, layerH = h / count;
        for (var i = count - 1; i >= 0; i--) {
          var item = state.items[i];
          var currentH = layerH * (i + 1);
          var currentW = botW * ((i + 1) / count);
          var lx = (w - currentW) / 2;
          var hex = getItemHex(item);
          inner += '<polygon points="' + (w/2) + ',0 ' + (lx+currentW) + ',' + currentH + ' ' + lx + ',' + currentH + '" fill="' + hex + '" stroke="#fff" stroke-width="2"/>';
        }
        for (var i = count - 1; i >= 0; i--) {
           var item = state.items[i];
           var currentH = layerH * (i + 1);
           var textY = currentH - (layerH / 2) + 6;
           var hex = getItemHex(item), txtCol = getTextColor(hex);
           inner += '<text x="' + (w/2) + '" y="' + textY + '" fill="'+txtCol+'" font-size="18" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        }

      } else if (state.type === 'matrix') {
        var gap = 15;
        var bw = 380, bh = 180, pos = [ {x: 500+gap, y: 250-bh-gap}, {x: 500-bw-gap, y: 250-bh-gap}, {x: 500-bw-gap, y: 250+gap}, {x: 500+gap, y: 250+gap} ];
        state.items.slice(0, 4).forEach(function(item, i) {
          var hex = getItemHex(item), txtCol = getTextColor(hex), p = pos[i];
          inner += '<rect x="' + p.x + '" y="' + p.y + '" width="' + bw + '" height="' + bh + '" fill="' + hex + '" rx="8"/>';
          inner += '<text x="' + (p.x + 20) + '" y="' + (p.y + 40) + '" fill="' + txtCol + '" font-size="18" font-weight="bold">' + escapeHtml(item.title) + '</text>';
          inner += '<text x="' + (p.x + 20) + '" y="' + (p.y + 80) + '" fill="' + txtCol + '" font-size="14">' + escapeHtml(item.desc) + '</text>';
        });

      } else if (state.type === 'cycle') {
        var cx = w / 2, cy = h / 2, r = 140;
        inner += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#6F6F6F" stroke-width="6"/>';
        state.items.forEach(function(item, i) {
          var angle = (i * 2 * Math.PI / count) - (Math.PI / 2), x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
          var hex = getItemHex(item), txtCol = getTextColor(hex);
          inner += '<circle cx="' + x + '" cy="' + y + '" r="45" fill="' + hex + '" stroke="#fff" stroke-width="2"/>';
          inner += '<text x="' + x + '" y="' + (y + 6) + '" fill="' + txtCol + '" font-size="14" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'onion') {
        var cx = w / 2 - 150, cy = h / 2, maxR = 200, stepR = maxR / count;
        for (var i = count - 1; i >= 0; i--) {
          var cr = stepR * (i + 1), hex = getItemHex(state.items[i]);
          inner += '<circle cx="' + cx + '" cy="' + cy + '" r="' + cr + '" fill="' + hex + '" stroke="#fff" stroke-width="2"/>';
        }
        state.items.forEach(function(item, i) {
          var ty = cy - maxR + (i * (maxR * 2 / count)) + 20, tx = cx + maxR + 30;
          inner += '<text x="' + tx + '" y="' + ty + '" fill="#070322" font-size="16" font-weight="bold">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'venn') {
        var cy = h / 2, r = 120, ac = Math.min(count, 3);
        var centers = ac >= 3 ? [{x: w/2 - 60, y: cy - 40}, {x: w/2 + 60, y: cy - 40}, {x: w/2, y: cy + 60}] : [{x: w/2 - 70, y: cy}, {x: w/2 + 70, y: cy}];
        for(var i=0; i<ac; i++) {
          var hex = getItemHex(state.items[i]), txtCol = getTextColor(hex), cx = centers[i].x, cyc = centers[i].y;
          inner += '<circle cx="' + cx + '" cy="' + cyc + '" r="' + r + '" fill="' + hex + '" opacity="0.85" stroke="#fff" stroke-width="2"/>';
          var ny = (ac>=3 && i===2) ? cyc + 30 : cyc - 40;
          var nx = (ac>=3 && i===0) ? cx - 20 : (ac>=3 && i===1) ? cx + 20 : cx;
          inner += '<text x="' + nx + '" y="' + ny + '" fill="' + txtCol + '" font-size="16" font-weight="bold" text-anchor="middle">' + escapeHtml(state.items[i].title) + '</text>';
        }
        inner += '<text x="'+(w/2)+'" y="'+(cy-10)+'" fill="#070322" font-size="14" font-weight="bold" text-anchor="middle">[重なり]</text>';

      } else if (state.type === 'timeline') {
        inner += '<line x1="100" y1="250" x2="900" y2="250" stroke="#6F6F6F" stroke-width="6"/>';
        var stepW = 800 / Math.max(1, count - 1);
        state.items.forEach(function(item, i) {
          var x = 100 + i * stepW, hex = getItemHex(item), txtCol = getTextColor(hex), cy = (i % 2 === 0) ? 140 : 310;
          inner += '<circle cx="' + x + '" cy="250" r="14" fill="' + hex + '" stroke="#fff" stroke-width="3"/>';
          inner += '<rect x="' + (x - 70) + '" y="' + cy + '" width="140" height="70" fill="' + hex + '" rx="8"/>';
          inner += '<text x="' + x + '" y="' + (cy + 35) + '" fill="' + txtCol + '" font-size="13" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
        });

      } else if (state.type === 'comparison') {
        var colW = 220, gap=20, totalW = count * colW + (count-1)*gap, startX = (w - totalW) / 2;
        state.items.forEach(function(item, i) {
          var x = startX + i * (colW + gap), hex = getItemHex(item), txtCol = getTextColor(hex);
          inner += '<rect x="' + x + '" y="100" width="' + colW + '" height="250" fill="#fafafa" stroke="'+hex+'" stroke-width="2"/>';
          inner += '<rect x="' + x + '" y="100" width="' + colW + '" height="40" fill="' + hex + '"/>';
          inner += '<text x="' + (x + colW/2) + '" y="125" fill="' + txtCol + '" font-size="16" font-weight="bold" text-anchor="middle">' + escapeHtml(item.title) + '</text>';
          inner += '<text x="' + (x + 15) + '" y="170" fill="#070322" font-size="13">' + escapeHtml(item.desc) + '</text>';
        });
      }

      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '">' + inner + '</svg>';
    }

    function updatePreview() { document.getElementById('previewBox').innerHTML = generateSVG(); }
    function updateAll() { renderInputs(); updatePreview(); }

// PowerPoint JavaScript API（PowerPoint.run）を用いた全11種のネイティブ図形挿入処理
async function insertToSlide() {
  var btn = document.getElementById('btnInsert');
  btn.disabled = true;
  btn.textContent = '挿入中...';
  log('PowerPointへ編集可能な図形を挿入中...');

  try {
    if (typeof PowerPoint !== 'undefined' && PowerPoint.run) {
      await PowerPoint.run(async (context) => {
        const slide = context.presentation.getSelectedSlides().getItemAt(0);
        const shapes = slide.shapes;

        var count = state.items.length;
        var startLeft = 80;
        var startTop = 120;
        var totalWidth = 600;
        var totalHeight = 300;

        // 1. パーチェスファネル（台形重ね ※API制限により角度調整不可）
        if (state.type === 'funnel') {
          var layerH = totalHeight / count;
          var topW = 520, botW = 200;
          for (var i = 0; i < count; i++) {
            var item = state.items[i], hex = getItemHex(item);
            var curW = topW - (topW - botW) * (i / (count > 1 ? count - 1 : 1));
            var shape = shapes.addGeometricShape(PowerPoint.GeometricShapeType.trapezoid, {
              left: startLeft + (totalWidth - curW) / 2, top: startTop + i * layerH, width: curW, height: layerH - 3
            });
            shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF"; shape.lineFormat.weight = 1.5;
            shape.textFrame.textRange.text = item.title + (item.desc ? "\n" + item.desc : "");
            shape.textFrame.textRange.font.color = getTextColor(hex); shape.textFrame.textRange.font.bold = true;
          }

        // 2. シェブロン（横ステップ矢印）
        } else if (state.type === 'chevron') {
          var gap = 10, boxW = (totalWidth - (count - 1) * gap) / count;
          for (var i = 0; i < count; i++) {
            var item = state.items[i], hex = getItemHex(item);
            var shape = shapes.addGeometricShape(PowerPoint.GeometricShapeType.chevron, {
              left: startLeft + i * (boxW + gap), top: startTop + 40, width: boxW, height: 180
            });
            shape.fill.setSolidColor(hex); shape.lineFormat.visible = false;
            shape.textFrame.textRange.text = item.title + (item.desc ? "\n" + item.desc : "");
            shape.textFrame.textRange.font.color = getTextColor(hex); shape.textFrame.textRange.font.bold = true;
          }

        // 3. プロセス（四角形 ＋ 矢印）
        } else if (state.type === 'process_arrow') {
          var gap = 10, arrowW = 20, boxW = (totalWidth - (count - 1) * (gap * 2 + arrowW)) / count;
          for (var i = 0; i < count; i++) {
            var item = state.items[i], hex = getItemHex(item), curLeft = startLeft + i * (boxW + gap * 2 + arrowW);
            var shape = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rectangle, {
              left: curLeft, top: startTop + 60, width: boxW, height: 120
            });
            shape.fill.setSolidColor(hex); shape.lineFormat.visible = false;
            shape.textFrame.textRange.text = item.title + (item.desc ? "\n" + item.desc : "");
            shape.textFrame.textRange.font.color = getTextColor(hex); shape.textFrame.textRange.font.bold = true;
            if (i < count - 1) {
              var arrow = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rightArrow, {
                left: curLeft + boxW + gap, top: startTop + 105, width: arrowW, height: 30
              });
              arrow.fill.setSolidColor("#6F6F6F"); arrow.lineFormat.visible = false;
            }
          }

        // 4. 単体カスタム矢印（UI選択に連動）
        } else if (state.type === 'standalone_arrow') {
          var gap = 20, layerH = (totalHeight - (count - 1) * gap) / count;
          var at = state.arrowType || 'block'; 
          for (var i = 0; i < count; i++) {
            var item = state.items[i], hex = getItemHex(item);
            var sType = PowerPoint.GeometricShapeType.rightArrow;
            var w = totalWidth, h = layerH, t = startTop + i * (layerH + gap);
            
            // 直線（太さに応じて細い矢印化）
            if (at === 'line') {
              h = state.arrowWeight * 5; 
              t = t + (layerH - h) / 2;
            // 曲線
            } else if (at === 'curved_up') {
              sType = PowerPoint.GeometricShapeType.bentUpArrow; 
            }
            
            var shape = shapes.addGeometricShape(sType, { left: startLeft, top: t, width: w, height: h });
            shape.fill.setSolidColor(hex); shape.lineFormat.visible = false;
            shape.textFrame.textRange.text = item.title + (item.desc ? " - " + item.desc : "");
            shape.textFrame.textRange.font.color = getTextColor(hex); shape.textFrame.textRange.font.bold = true;
          }

        // 5. ピラミッド（上部を三角形、下部を台形で表現）
        } else if (state.type === 'pyramid') {
          var layerH = totalHeight / count, botW = 500;
          for (var i = 0; i < count; i++) {
            var item = state.items[i], hex = getItemHex(item);
            var curW = botW * ((i + 1) / count);
            var sType = (i === 0) ? PowerPoint.GeometricShapeType.triangle : PowerPoint.GeometricShapeType.trapezoid;
            var shape = shapes.addGeometricShape(sType, {
              left: startLeft + (totalWidth - curW) / 2, top: startTop + i * layerH, width: curW, height: layerH - 2
            });
            shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF";
            shape.textFrame.textRange.text = item.title;
            shape.textFrame.textRange.font.color = getTextColor(hex); shape.textFrame.textRange.font.bold = true;
          }

        // 6. 2x2 マトリクス
        } else if (state.type === 'matrix') {
          var gap = 15, bw = (totalWidth - gap) / 2, bh = 140;
          var pos = [{l:startLeft+bw+gap, t:startTop}, {l:startLeft, t:startTop}, {l:startLeft, t:startTop+bh+gap}, {l:startLeft+bw+gap, t:startTop+bh+gap}];
          for (var i = 0; i < Math.min(count, 4); i++) {
            var item = state.items[i], hex = getItemHex(item), p = pos[i];
            var shape = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rectangle, { left: p.l, top: p.t, width: bw, height: bh });
            shape.fill.setSolidColor(hex); shape.lineFormat.visible = false;
            shape.textFrame.textRange.text = item.title + (item.desc ? "\n" + item.desc : "");
            shape.textFrame.textRange.font.color = getTextColor(hex); shape.textFrame.textRange.font.bold = true;
          }

        // 7. 3C / 2C ベン図（透過円＋中央テキスト）
        } else if (state.type === 'venn') {
          var r = 200, ac = Math.min(count, 3);
          var cx = startLeft + totalWidth / 2, cy = startTop + totalHeight / 2;
          var pos = ac >= 3 ? [ { x: cx - 60, y: cy - 40 }, { x: cx + 60, y: cy - 40 }, { x: cx, y: cy + 60 } ] : [ { x: cx - 70, y: cy }, { x: cx + 70, y: cy } ];
          // 円を描画
          for (var i = 0; i < ac; i++) {
            var hex = getItemHex(state.items[i]);
            var shape = shapes.addGeometricShape(PowerPoint.GeometricShapeType.oval, { left: pos[i].x - r/2, top: pos[i].y - r/2, width: r, height: r });
            shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF"; shape.lineFormat.weight = 2;
            shape.fill.transparency = 0.3; // 透過設定
          }
          // テキストを前面に配置
          for (var i = 0; i < ac; i++) {
            var txtBox = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rectangle, { left: pos[i].x - r/2, top: pos[i].y - 20, width: r, height: 40 });
            txtBox.fill.clear(); txtBox.lineFormat.visible = false;
            txtBox.textFrame.textRange.text = state.items[i].title;
            txtBox.textFrame.textRange.font.color = "#000000"; txtBox.textFrame.textRange.font.bold = true;
          }

        // 8. カラム比較
        } else if (state.type === 'comparison') {
          var gap = 20, colW = (totalWidth - (count - 1) * gap) / count;
          for (var i = 0; i < count; i++) {
            var item = state.items[i], hex = getItemHex(item), curLeft = startLeft + i * (colW + gap);
            var head = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rectangle, { left: curLeft, top: startTop, width: colW, height: 40 });
            head.fill.setSolidColor(hex); head.lineFormat.visible = false;
            head.textFrame.textRange.text = item.title; head.textFrame.textRange.font.color = getTextColor(hex); head.textFrame.textRange.font.bold = true;
            var body = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rectangle, { left: curLeft, top: startTop+45, width: colW, height: totalHeight-45 });
            body.fill.setSolidColor("#FAFAFA"); body.lineFormat.color = hex; body.lineFormat.weight = 2;
            body.textFrame.textRange.text = item.desc; body.textFrame.textRange.font.color = "#000000";
          }

        // 9. 循環 / ループ（円を並べて間に矢印を配置）
        } else if (state.type === 'cycle') {
          var cx = startLeft + totalWidth / 2, cy = startTop + totalHeight / 2, r = 110;
          for (var i = 0; i < count; i++) {
            var item = state.items[i], hex = getItemHex(item);
            var angle = (i * 2 * Math.PI / count) - (Math.PI / 2);
            // 円
            var shape = shapes.addGeometricShape(PowerPoint.GeometricShapeType.oval, { left: cx + r * Math.cos(angle) - 45, top: cy + r * Math.sin(angle) - 45, width: 90, height: 90 });
            shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF";
            shape.textFrame.textRange.text = item.title; shape.textFrame.textRange.font.color = getTextColor(hex); shape.textFrame.textRange.font.bold = true;
            
            // 接続矢印
            var nextAngle = ((i + 1) * 2 * Math.PI / count) - (Math.PI / 2);
            var arrowAngle = (angle + nextAngle) / 2;
            var rotDeg = (arrowAngle * 180 / Math.PI) + 90; 
            var arrow = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rightArrow, { left: cx + r * Math.cos(arrowAngle) - 15, top: cy + r * Math.sin(arrowAngle) - 15, width: 30, height: 30 });
            arrow.fill.setSolidColor("#6F6F6F"); arrow.lineFormat.visible = false; arrow.rotation = rotDeg;
          }

        // 10. 同心円（オニオン構造）
        } else if (state.type === 'onion') {
          var cx = startLeft + totalWidth / 2, cy = startTop + totalHeight / 2 + 20, maxR = Math.min(totalWidth / 2, totalHeight / 2);
          // 後ろの大きな円から描画
          for (var i = count - 1; i >= 0; i--) {
            var hex = getItemHex(state.items[i]), cr = (maxR / count) * (i + 1);
            var shape = shapes.addGeometricShape(PowerPoint.GeometricShapeType.oval, { left: cx - cr, top: cy - cr, width: cr * 2, height: cr * 2 });
            shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF"; shape.lineFormat.weight = 2;
          }
          // テキストが隠れないよう最後に配置
          for (var i = count - 1; i >= 0; i--) {
            var item = state.items[i], hex = getItemHex(item), cr = (maxR / count) * (i + 1);
            var txtBox = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rectangle, { left: cx - cr, top: cy - cr + 5, width: cr * 2, height: 30 });
            txtBox.fill.clear(); txtBox.lineFormat.visible = false;
            txtBox.textFrame.textRange.text = item.title; txtBox.textFrame.textRange.font.color = getTextColor(hex); txtBox.textFrame.textRange.font.bold = true;
          }

        // 11. タイムライン（軸線＋ドット＋テキストボックス）
        } else if (state.type === 'timeline') {
          var lineY = startTop + totalHeight / 2;
          var line = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rectangle, { left: startLeft, top: lineY - 2, width: totalWidth, height: 4 });
          line.fill.setSolidColor("#6F6F6F"); line.lineFormat.visible = false;
          var stepW = totalWidth / Math.max(1, count - 1);
          
          for (var i = 0; i < count; i++) {
            var item = state.items[i], hex = getItemHex(item), x = startLeft + i * stepW, isTop = (i % 2 === 0);
            // 縦の線（ステム）
            var stemH = 60, stemY = isTop ? lineY - stemH : lineY;
            var stem = shapes.addGeometricShape(PowerPoint.GeometricShapeType.rectangle, { left: x - 1, top: stemY, width: 2, height: stemH });
            stem.fill.setSolidColor("#6F6F6F"); stem.lineFormat.visible = false;
            // ドット
            var dot = shapes.addGeometricShape(PowerPoint.GeometricShapeType.oval, { left: x - 8, top: lineY - 8, width: 16, height: 16 });
            dot.fill.setSolidColor(hex); dot.lineFormat.color = "#FFFFFF"; dot.lineFormat.weight = 2;
            // ボックス
            var boxW = 110, boxH = 50, boxY = isTop ? lineY - stemH - boxH : lineY + stemH;
            var box = shapes.addGeometricShape(PowerPoint.GeometricShapeType.roundRectangle, { left: x - boxW/2, top: boxY, width: boxW, height: boxH });
            box.fill.setSolidColor(hex); box.lineFormat.visible = false;
            box.textFrame.textRange.text = item.title; box.textFrame.textRange.font.color = getTextColor(hex); box.textFrame.textRange.font.bold = true;
          }
        }

        await context.sync();
      });

      log('✔ 編集可能な図形・テキストとして挿入しました！');
    } else {
      log('PowerPoint環境外のため実行できません。', true);
    }
  } catch (e) {
    log('挿入エラー: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'PowerPointに挿入';
  }
}
