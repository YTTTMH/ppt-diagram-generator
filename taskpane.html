<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>構造図ジェネレーター</title>
  <!-- Office.js SDK -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; background: #f8fafc; color: #1e293b; font-size: 13px; }
    h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #0f172a; border-bottom: 2px solid #d24726; padding-bottom: 4px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 12px; }
    select, input, textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 13px; }
    .item-list { margin-bottom: 12px; }
    .item-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; background: #fff; padding: 6px; border-radius: 6px; border: 1px solid #e2e8f0; }
    .item-row input[type="text"] { flex: 1; }
    .item-row input[type="color"] { width: 32px; height: 32px; border: none; cursor: pointer; background: transparent; }
    .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 13px; }
    .btn-primary { background: #d24726; color: #fff; margin-top: 10px; }
    .btn-primary:hover { background: #b0361a; }
    .btn-secondary { background: #e2e8f0; color: #334155; width: auto; padding: 4px 8px; font-size: 11px; margin-bottom: 8px; }
    .btn-danger { background: #ef4444; color: #fff; width: 28px; height: 28px; padding: 0; border-radius: 4px; }
    #log { margin-top: 12px; padding: 8px; border-radius: 6px; font-size: 11px; background: #e2e8f0; color: #334155; word-break: break-all; }
  </style>
</head>
<body>

  <h2>構造図ジェネレーター</h2>

  <div class="form-group">
    <label>図形タイプ</label>
    <select id="typeSelect" onchange="onTypeChange(this.value)">
      <option value="funnel">1. パーチェスファネル</option>
      <option value="chevron">2. シェブロン（横ステップ）</option>
      <option value="process_arrow">3. プロセス（角丸＋矢印）</option>
      <option value="standalone_arrow">4. 単体矢印（直線/曲線/ブロック）</option>
      <option value="pyramid">5. ピラミッド</option>
      <option value="matrix">6. 2x2 マトリクス</option>
      <option value="venn">7. ベン図（2C / 3C）</option>
      <option value="comparison">8. カラム比較</option>
      <option value="cycle">9. 循環ループ</option>
      <option value="onion">10. 同心円（オニオン）</option>
      <option value="timeline">11. タイムライン</option>
    </select>
  </div>

  <div id="arrowSubOptions" class="form-group" style="display:none;">
    <label>矢印の形状</label>
    <select id="arrowTypeSelect" onchange="state.arrowType=this.value;">
      <option value="block">ブロック矢印</option>
      <option value="curved_up">曲線矢印（右上り）</option>
      <option value="line">直線矢印</option>
    </select>
  </div>

  <div class="form-group">
    <label>要素一覧</label>
    <button class="btn btn-secondary" onclick="addItem()">＋ 要素を追加</button>
    <div id="itemList" class="item-list"></div>
  </div>

  <button id="btnInsert" class="btn btn-primary" onclick="insertToSlide()">PowerPointに挿入</button>
  <div id="log">準備完了</div>

  <script>
    // State 管理
    var state = {
      type: 'funnel',
      arrowType: 'block',
      arrowWeight: 2,
      colors: ['#0284c7', '#0d9488', '#16a34a', '#ca8a04', '#dc2626'],
      items: [
        { title: '認知', desc: 'ブランドの認知拡大' },
        { title: '興味', desc: '製品への関心喚起' },
        { title: '検討', desc: '他社比較と検討' },
        { title: '購入', desc: '最終コンバージョン' }
      ]
    };

    Office.onReady(function(info) {
      log('Office.js 準備完了 (' + info.host + ')');
      renderItems();
    });

    function log(msg, isError) {
      var el = document.getElementById('log');
      el.textContent = msg;
      el.style.color = isError ? '#dc2626' : '#334155';
    }

    function getItemHex(item, index) {
      return item.color || state.colors[index % state.colors.length];
    }

    function getTextColor(hex) {
      if (!hex) return '#FFFFFF';
      var c = hex.replace('#', '');
      var r = parseInt(c.substr(0, 2), 16);
      var g = parseInt(c.substr(2, 2), 16);
      var b = parseInt(c.substr(4, 2), 16);
      var brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 150 ? '#000000' : '#FFFFFF';
    }

    function onTypeChange(val) {
      state.type = val;
      document.getElementById('arrowSubOptions').style.display = (val === 'standalone_arrow') ? 'block' : 'none';
    }

    function renderItems() {
      var container = document.getElementById('itemList');
      container.innerHTML = '';
      state.items.forEach(function(item, idx) {
        var row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = 
          '<input type="color" value="' + getItemHex(item, idx) + '" onchange="state.items[' + idx + '].color=this.value">' +
          '<input type="text" placeholder="タイトル" value="' + (item.title || '') + '" oninput="state.items[' + idx + '].title=this.value">' +
          '<input type="text" placeholder="説明 (任意)" value="' + (item.desc || '') + '" oninput="state.items[' + idx + '].desc=this.value">' +
          '<button class="btn btn-danger" onclick="removeItem(' + idx + ')">×</button>';
        container.appendChild(row);
      });
    }

    function addItem() {
      state.items.push({ title: '新規項目', desc: '' });
      renderItems();
    }

    function removeItem(idx) {
      if (state.items.length > 1) {
        state.items.splice(idx, 1);
        renderItems();
      }
    }

    // 1. PowerPoint APIの形状定数を安全に取得するヘルパー
    function getShapeType(key) {
      if (typeof PowerPoint !== 'undefined' && PowerPoint.GeometricShapeType) {
        var GST = PowerPoint.GeometricShapeType;
        var map = {
          'rectangle': GST.rectangle,
          'roundRectangle': GST.roundRectangle,
          'trapezoid': GST.trapezoid,
          'chevron': GST.chevron,
          'rightArrow': GST.rightArrow,
          'curvedUpArrow': GST.bentUpArrow || GST.curvedUpArrow,
          'triangle': GST.triangle,
          'ellipse': GST.ellipse
        };
        if (map[key]) return map[key];
      }
      var fallbackMap = {
        'rectangle': 'Rectangle',
        'roundRectangle': 'RoundRectangle',
        'trapezoid': 'Trapezoid',
        'chevron': 'Chevron',
        'rightArrow': 'RightArrow',
        'curvedUpArrow': 'BentUpArrow',
        'triangle': 'Triangle',
        'ellipse': 'Ellipse'
      };
      return fallbackMap[key] || 'Rectangle';
    }

    // 2. テキスト設定ヘルパー
    function addText(shape, text, color, size) {
      if (shape && shape.textFrame && shape.textFrame.textRange) {
        shape.textFrame.textRange.text = text || '';
        if (color) shape.textFrame.textRange.font.color = color;
        shape.textFrame.textRange.font.bold = true;
        if (size) shape.textFrame.textRange.font.size = size;
      }
    }

    // 3. スライド挿入メイン処理
    async function insertToSlide() {
      var btn = document.getElementById('btnInsert');
      btn.disabled = true;
      btn.textContent = '挿入中...';
      log('PowerPointへ編集可能な図形を挿入中...');

      try {
        if (typeof PowerPoint !== 'undefined' && PowerPoint.run) {
          await PowerPoint.run(async (context) => {
            const slide = context.presentation.getSelectedSlides().getItemAt(0);
            const shapes = slide.shapes;

            var count = state.items.length;
            var startLeft = 80, startTop = 120;
            var totalWidth = 600, totalHeight = 300;

            // 1. パーチェスファネル
            if (state.type === 'funnel') {
              var layerH = totalHeight / count, topW = 540, botW = 150;
              for (var i = 0; i < count; i++) {
                var item = state.items[i], hex = getItemHex(item, i);
                var curW = topW - (topW - botW) * (i / (count > 1 ? count - 1 : 1));
                var curLeft = startLeft + (totalWidth - curW) / 2;

                var shape = shapes.addGeometricShape(getShapeType('trapezoid'), { left: curLeft, top: startTop + i * layerH, width: curW, height: layerH - 3 });
                shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF"; shape.lineFormat.weight = 1.5;
                shape.rotation = 180; // 逆台形化

                var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: curLeft, top: startTop + i * layerH, width: curW, height: layerH - 3 });
                txtBox.fill.clear(); txtBox.lineFormat.visible = false;
                addText(txtBox, item.title + (item.desc ? "\n" + item.desc : ""), getTextColor(hex), 13);
              }

            // 2. シェブロン
            } else if (state.type === 'chevron') {
              var gap = 10, boxW = (totalWidth - (count - 1) * gap) / count;
              for (var i = 0; i < count; i++) {
                var item = state.items[i], hex = getItemHex(item, i);
                var shape = shapes.addGeometricShape(getShapeType('chevron'), { left: startLeft + i * (boxW + gap), top: startTop + 40, width: boxW, height: 180 });
                shape.fill.setSolidColor(hex); shape.lineFormat.visible = false;
                addText(shape, item.title + (item.desc ? "\n" + item.desc : ""), getTextColor(hex), 13);
              }

            // 3. プロセス（角丸＋矢印）
            } else if (state.type === 'process_arrow') {
              var gap = 10, arrowW = 20, boxW = (totalWidth - (count - 1) * (gap * 2 + arrowW)) / count;
              for (var i = 0; i < count; i++) {
                var item = state.items[i], hex = getItemHex(item, i), curLeft = startLeft + i * (boxW + gap * 2 + arrowW);
                var shape = shapes.addGeometricShape(getShapeType('roundRectangle'), { left: curLeft, top: startTop + 60, width: boxW, height: 120 });
                shape.fill.setSolidColor(hex); shape.lineFormat.visible = false;
                addText(shape, item.title + (item.desc ? "\n" + item.desc : ""), getTextColor(hex), 13);

                if (i < count - 1) {
                  var arrow = shapes.addGeometricShape(getShapeType('rightArrow'), { left: curLeft + boxW + gap, top: startTop + 105, width: arrowW, height: 30 });
                  arrow.fill.setSolidColor("#6F6F6F"); arrow.lineFormat.visible = false;
                }
              }

            // 4. 単体カスタム矢印
            } else if (state.type === 'standalone_arrow') {
              var gap = 15, layerH = (totalHeight - (count - 1) * gap) / count;
              var at = state.arrowType || 'block';
              for (var i = 0; i < count; i++) {
                var item = state.items[i], hex = getItemHex(item, i);
                var sType = getShapeType('rightArrow'), w = totalWidth, h = layerH, t = startTop + i * (layerH + gap);

                if (at === 'line') {
                  h = Math.max(8, state.arrowWeight * 4); t = t + (layerH - h) / 2;
                } else if (at === 'curved_up') {
                  sType = getShapeType('curvedUpArrow');
                }

                var shape = shapes.addGeometricShape(sType, { left: startLeft, top: t, width: w, height: h });
                shape.fill.setSolidColor(hex); shape.lineFormat.visible = false;

                var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: startLeft, top: startTop + i * (layerH + gap), width: w, height: layerH });
                txtBox.fill.clear(); txtBox.lineFormat.visible = false;
                addText(txtBox, item.title + (item.desc ? " - " + item.desc : ""), (at === 'line') ? '#000000' : getTextColor(hex), 14);
              }

            // 5. ピラミッド
            } else if (state.type === 'pyramid') {
              var botW = 560, layerH = totalHeight / count;
              for (var i = count - 1; i >= 0; i--) {
                var item = state.items[i], hex = getItemHex(item, i), curW = botW * ((i + 1) / count), curH = totalHeight * ((i + 1) / count);
                var shape = shapes.addGeometricShape(getShapeType('triangle'), { left: startLeft + (totalWidth - curW) / 2, top: startTop, width: curW, height: curH });
                shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF"; shape.lineFormat.weight = 2;

                var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: startLeft, top: startTop + i * layerH, width: totalWidth, height: layerH });
                txtBox.fill.clear(); txtBox.lineFormat.visible = false;
                addText(txtBox, item.title, getTextColor(hex), 14);
              }

            // 6. 2x2 マトリクス
            } else if (state.type === 'matrix') {
              var gap = 15, bw = (totalWidth - gap) / 2, bh = 140;
              var pos = [{l:startLeft+bw+gap, t:startTop}, {l:startLeft, t:startTop}, {l:startLeft, t:startTop+bh+gap}, {l:startLeft+bw+gap, t:startTop+bh+gap}];
              for (var i = 0; i < Math.min(count, 4); i++) {
                var item = state.items[i], hex = getItemHex(item, i), p = pos[i];
                var shape = shapes.addGeometricShape(getShapeType('roundRectangle'), { left: p.l, top: p.t, width: bw, height: bh });
                shape.fill.setSolidColor(hex); shape.lineFormat.visible = false;
                addText(shape, item.title + (item.desc ? "\n" + item.desc : ""), getTextColor(hex), 13);
              }

            // 7. ベン図
            } else if (state.type === 'venn') {
              var r = 200, ac = Math.min(count, 3), cx = startLeft + totalWidth / 2, cy = startTop + totalHeight / 2;
              var pos = ac >= 3 ? [ { x: cx - 50, y: cy - 35 }, { x: cx + 50, y: cy - 35 }, { x: cx, y: cy + 50 } ] : [ { x: cx - 70, y: cy }, { x: cx + 70, y: cy } ];

              for (var i = 0; i < ac; i++) {
                var hex = getItemHex(state.items[i], i);
                var shape = shapes.addGeometricShape(getShapeType('ellipse'), { left: pos[i].x - r/2, top: pos[i].y - r/2, width: r, height: r });
                shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF"; shape.lineFormat.weight = 2;
              }

              var overlapBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: cx - 50, top: cy - 15, width: 100, height: 30 });
              overlapBox.fill.clear(); overlapBox.lineFormat.visible = false;
              addText(overlapBox, "[重なり]", "#000000", 12);

              var txtPos = ac >= 3 ? [ { x: cx - 80, y: cy - 70 }, { x: cx + 80, y: cy - 70 }, { x: cx, y: cy + 90 } ] : [ { x: cx - 100, y: cy }, { x: cx + 100, y: cy } ];
              for (var i = 0; i < ac; i++) {
                var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: txtPos[i].x - 50, top: txtPos[i].y - 15, width: 100, height: 30 });
                txtBox.fill.clear(); txtBox.lineFormat.visible = false;
                addText(txtBox, state.items[i].title, "#000000", 13);
              }

            // 8. カラム比較
            } else if (state.type === 'comparison') {
              var gap = 20, colW = (totalWidth - (count - 1) * gap) / count;
              for (var i = 0; i < count; i++) {
                var item = state.items[i], hex = getItemHex(item, i), curLeft = startLeft + i * (colW + gap);
                var head = shapes.addGeometricShape(getShapeType('rectangle'), { left: curLeft, top: startTop, width: colW, height: 40 });
                head.fill.setSolidColor(hex); head.lineFormat.visible = false;
                addText(head, item.title, getTextColor(hex), 13);

                var body = shapes.addGeometricShape(getShapeType('rectangle'), { left: curLeft, top: startTop+45, width: colW, height: totalHeight-45 });
                body.fill.setSolidColor("#FAFAFA"); body.lineFormat.color = hex; body.lineFormat.weight = 2;
                addText(body, item.desc, "#000000", 12);
              }

            // 9. 循環ループ
            } else if (state.type === 'cycle') {
              var cx = startLeft + totalWidth / 2, cy = startTop + totalHeight / 2, r = 100;
              var track = shapes.addGeometricShape(getShapeType('ellipse'), { left: cx - r, top: cy - r, width: r * 2, height: r * 2 });
              track.fill.clear(); track.lineFormat.color = "#CBD5E1"; track.lineFormat.weight = 4;

              for (var i = 0; i < count; i++) {
                var item = state.items[i], hex = getItemHex(item, i), angle = (i * 2 * Math.PI / count) - (Math.PI / 2);
                var nx = cx + r * Math.cos(angle), ny = cy + r * Math.sin(angle);

                var shape = shapes.addGeometricShape(getShapeType('ellipse'), { left: nx - 30, top: ny - 30, width: 60, height: 60 });
                shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF"; shape.lineFormat.weight = 2;

                var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: nx - 60, top: ny + 32, width: 120, height: 30 });
                txtBox.fill.clear(); txtBox.lineFormat.visible = false;
                addText(txtBox, item.title, "#000000", 12);
              }

            // 10. 同心円
            } else if (state.type === 'onion') {
              var cx = startLeft + totalWidth / 2 - 40, cy = startTop + totalHeight / 2, maxR = Math.min(totalWidth / 2, totalHeight / 2);
              for (var i = count - 1; i >= 0; i--) {
                var hex = getItemHex(state.items[i], i), cr = (maxR / count) * (i + 1);
                var shape = shapes.addGeometricShape(getShapeType('ellipse'), { left: cx - cr, top: cy - cr, width: cr * 2, height: cr * 2 });
                shape.fill.setSolidColor(hex); shape.lineFormat.color = "#FFFFFF"; shape.lineFormat.weight = 2;

                var txtBox = shapes.addGeometricShape(getShapeType('rectangle'), { left: cx - cr, top: cy - cr + 5, width: cr * 2, height: 25 });
                txtBox.fill.clear(); txtBox.lineFormat.visible = false;
                addText(txtBox, state.items[i].title, getTextColor(hex), 12);
              }

            // 11. タイムライン
            } else if (state.type === 'timeline') {
              var lineY = startTop + totalHeight / 2;
              var line = shapes.addGeometricShape(getShapeType('rightArrow'), { left: startLeft, top: lineY - 8, width: totalWidth, height: 16 });
              line.fill.setSolidColor("#CBD5E1"); line.lineFormat.visible = false;

              var stepW = totalWidth / (count + 0.5);
              for (var i = 0; i < count; i++) {
                var item = state.items[i], hex = getItemHex(item, i), x = startLeft + 35 + i * stepW, isTop = (i % 2 === 0);

                var stemH = 45, stemY = isTop ? lineY - stemH : lineY;
                var stem = shapes.addGeometricShape(getShapeType('rectangle'), { left: x - 1, top: stemY, width: 2, height: stemH });
                stem.fill.setSolidColor("#94A3B8"); stem.lineFormat.visible = false;

                var dot = shapes.addGeometricShape(getShapeType('ellipse'), { left: x - 10, top: lineY - 10, width: 20, height: 20 });
                dot.fill.setSolidColor(hex); dot.lineFormat.color = "#FFFFFF"; dot.lineFormat.weight = 2;

                var boxY = isTop ? lineY - stemH - 40 : lineY + stemH;
                var box = shapes.addGeometricShape(getShapeType('roundRectangle'), { left: x - 55, top: boxY, width: 110, height: 40 });
                box.fill.clear(); box.lineFormat.visible = false;
                addText(box, item.title, "#000000", 12);
              }
            }

            await context.sync();
          });

          log('✔ PowerPointに正常挿入されました！');
        } else {
          log('PowerPoint環境外です。', true);
        }
      } catch (e) {
        log('挿入エラー: ' + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'PowerPointに挿入';
      }
    }
  </script>
</body>
</html>
